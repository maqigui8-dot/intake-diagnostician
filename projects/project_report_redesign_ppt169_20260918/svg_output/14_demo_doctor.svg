<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F5EF"/><text x="68" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="700" fill="#155348">项目操作展示：医生工作台与总结</text><g id="screen" font-family="Microsoft YaHei, Arial, sans-serif"><rect x="68" y="132" width="1092" height="360" fill="#EFEEE8" stroke="#155348" stroke-width="2"/><text x="94" y="168" font-size="14" font-weight="700" fill="#C86A3A">医生三栏工作台 / 放置完整截图</text><text x="614" y="302" text-anchor="middle" font-size="23" font-weight="700" fill="#155348">患者列表　·　问诊详情　·　决策解释</text><text x="614" y="338" text-anchor="middle" font-size="15" fill="#7B8783">建议截图同时包含多个患者和一次完整问诊详情</text></g><g id="annotations" font-family="Microsoft YaHei, Arial, sans-serif"><line x1="68" y1="528" x2="1160" y2="528" stroke="#BFCFC9"/><text x="68" y="565" font-size="15" font-weight="700" fill="#C86A3A">01</text><text x="104" y="565" font-size="18" font-weight="700" fill="#263D38">患者列表</text><text x="104" y="593" font-size="14" fill="#566762">档案数量与快速切换</text><text x="430" y="565" font-size="15" font-weight="700" fill="#C86A3A">02</text><text x="466" y="565" font-size="18" font-weight="700" fill="#263D38">问诊详情</text><text x="466" y="593" font-size="14" fill="#566762">基础资料、描述和逐轮问答</text><text x="802" y="565" font-size="15" font-weight="700" fill="#C86A3A">03</text><text x="838" y="565" font-size="18" font-weight="700" fill="#263D38">决策解释</text><text x="838" y="593" font-size="14" fill="#566762">完整度、关键缺口、来源和停止原因</text></g><text x="68" y="642" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#155348">规则约束 Agent，使诊前信息整理过程更安全、更可追踪，也更容易被医生理解。</text><text x="1136" y="670" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#566762">14</text></svg>
