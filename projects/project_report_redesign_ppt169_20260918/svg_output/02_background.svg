<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F5EF"/><g id="header"><text x="68" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="700" fill="#155348">项目背景与问题</text><text x="1160" y="76" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#7B8783">WHY</text></g><g id="hero" font-family="Microsoft YaHei, Arial, sans-serif"><text x="68" y="210" font-size="34" font-weight="700" fill="#263D38"><tspan x="68">患者已经说了很多，</tspan><tspan x="68" dy="52">为什么医生仍要重新问？</tspan></text><line x1="68" y1="338" x2="392" y2="338" stroke="#C86A3A" stroke-width="5"/><text x="68" y="390" font-size="18" fill="#566762"><tspan x="68">自然表达适合交流，却不天然等于</tspan><tspan x="68" dy="30">可直接使用的诊前资料。</tspan></text></g><g id="issues" font-family="Microsoft YaHei, Arial, sans-serif"><line x1="650" y1="150" x2="650" y2="555" stroke="#BFCFC9" stroke-width="2"/><circle cx="650" cy="190" r="8" fill="#C86A3A"/><text x="690" y="184" font-size="22" font-weight="700" fill="#263D38">描述零散</text><text x="690" y="213" font-size="16" fill="#566762">时间、程度和关联因素分散在多轮回答中</text><circle cx="650" cy="300" r="8" fill="#155348"/><text x="690" y="294" font-size="22" font-weight="700" fill="#263D38">重复询问</text><text x="690" y="323" font-size="16" fill="#566762">缺少字段状态时，同一信息可能被反复确认</text><circle cx="650" cy="410" r="8" fill="#155348"/><text x="690" y="404" font-size="22" font-weight="700" fill="#263D38">停止条件不清</text><text x="690" y="433" font-size="16" fill="#566762">可选细节持续阻塞结束，问诊轮数不断增加</text><circle cx="650" cy="520" r="8" fill="#C86A3A"/><text x="690" y="514" font-size="22" font-weight="700" fill="#263D38">决策难以解释</text><text x="690" y="543" font-size="16" fill="#566762">医生看不到当前问题来源和停止原因</text></g><g id="bottom"><text x="68" y="624" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#155348">项目需要解决：如何把自由描述转化为有限、可追踪、能及时结束的诊前采集过程</text><text x="1136" y="670" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#566762">02</text></g></svg>
