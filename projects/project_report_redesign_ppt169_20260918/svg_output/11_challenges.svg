<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F5EF"/><text x="68" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="700" fill="#155348">项目实现中的关键难点</text><g id="challenges" font-family="Microsoft YaHei, Arial, sans-serif"><text x="68" y="154" font-size="15" font-weight="700" fill="#C86A3A">01</text><text x="112" y="154" font-size="21" font-weight="700" fill="#263D38">追问轮数过多</text><text x="360" y="154" font-size="16" fill="#566762">核心字段驱动停止，可选字段不再无限阻塞结束</text><text x="1080" y="154" font-size="15" font-weight="700" fill="#155348">已实现</text><line x1="68" y1="184" x2="1160" y2="184" stroke="#D7DEDA"/>
<text x="68" y="238" font-size="15" font-weight="700" fill="#C86A3A">02</text><text x="112" y="238" font-size="21" font-weight="700" fill="#263D38">Agent 输出不稳定</text><text x="360" y="238" font-size="16" fill="#566762">Agent 提供字段与证据，确定性规则负责决策</text><text x="1080" y="238" font-size="15" font-weight="700" fill="#155348">已实现</text><line x1="68" y1="268" x2="1160" y2="268" stroke="#D7DEDA"/>
<text x="68" y="322" font-size="15" font-weight="700" fill="#C86A3A">03</text><text x="112" y="322" font-size="21" font-weight="700" fill="#263D38">“不知道”导致重复</text><text x="360" y="322" font-size="16" fill="#566762">记录尝试次数与回答质量，到达上限后转医生补充</text><text x="1080" y="322" font-size="15" font-weight="700" fill="#155348">已实现</text><line x1="68" y1="352" x2="1160" y2="352" stroke="#D7DEDA"/>
<text x="68" y="406" font-size="15" font-weight="700" fill="#C86A3A">04</text><text x="112" y="406" font-size="21" font-weight="700" fill="#263D38">多患者数据隔离</text><text x="360" y="406" font-size="16" fill="#566762">显式 patient_id 和资源归属校验，跨患者访问返回 404</text><text x="1080" y="406" font-size="15" font-weight="700" fill="#155348">已实现</text><line x1="68" y1="436" x2="1160" y2="436" stroke="#D7DEDA"/>
<rect x="68" y="492" width="1092" height="112" fill="#EFEEE8"/><text x="94" y="531" font-size="16" font-weight="700" fill="#C86A3A">当前边界</text><text x="94" y="568" font-size="17" fill="#566762">演示身份不等于正式鉴权；真实临床效果、规则覆盖范围和权限体系仍需进一步验证。</text></g><text x="1136" y="670" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#566762">11</text></svg>
