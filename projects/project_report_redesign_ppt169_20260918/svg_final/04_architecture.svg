<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F5EF"/><text x="68" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="700" fill="#155348">系统整体架构</text><g id="architecture" font-family="Microsoft YaHei, Arial, sans-serif"><text x="68" y="167" font-size="14" font-weight="700" fill="#7B8783">01 交互层</text><rect x="210" y="130" width="950" height="72" fill="#EFEEE8"/><text x="240" y="160" font-size="20" font-weight="700" fill="#263D38">患者端</text><text x="445" y="160" font-size="20" font-weight="700" fill="#263D38">医生工作台</text><text x="240" y="184" font-size="14" fill="#566762">问诊交互与档案</text><text x="445" y="184" font-size="14" fill="#566762">多患者只读查看</text><line x1="685" y1="202" x2="685" y2="225" stroke="#BFCFC9" stroke-width="2"/>
<text x="68" y="265" font-size="14" font-weight="700" fill="#7B8783">02 接口层</text><rect x="210" y="225" width="950" height="72" fill="#F7F5EF" stroke="#D7DEDA"/><text x="240" y="256" font-size="20" font-weight="700" fill="#263D38">FastAPI</text><text x="370" y="256" font-size="16" fill="#566762">患者隔离接口　会话接口　医生查询接口　档案归档接口</text><text x="240" y="280" font-size="14" fill="#7B8783">统一请求校验与 patient_id 资源归属检查</text><line x1="685" y1="297" x2="685" y2="320" stroke="#BFCFC9" stroke-width="2"/>
<text x="68" y="382" font-size="14" font-weight="700" fill="#C86A3A">03 决策层</text><rect x="210" y="320" width="950" height="124" fill="#155348"/><text x="250" y="360" font-size="23" font-weight="700" fill="#F7F5EF">Agent</text><text x="250" y="391" font-size="16" fill="#F7F5EF">理解回答、抽取字段、保存原文证据、组织自然问题</text><line x1="640" y1="342" x2="640" y2="422" stroke="#BFCFC9"/><text x="690" y="360" font-size="23" font-weight="700" fill="#F7F5EF">规则系统</text><text x="690" y="391" font-size="16" fill="#F7F5EF">判断状态、计算完整度、选择下一问、决定何时停止</text><text x="690" y="417" font-size="14" fill="#F7F5EF">确定性边界约束模型不确定性</text><line x1="685" y1="444" x2="685" y2="467" stroke="#BFCFC9" stroke-width="2"/>
<text x="68" y="512" font-size="14" font-weight="700" fill="#7B8783">04 数据层</text><rect x="210" y="467" width="950" height="92" fill="#EFEEE8"/><text x="240" y="503" font-size="20" font-weight="700" fill="#263D38">MySQL 完整持久化</text><text x="240" y="534" font-size="15" fill="#566762">患者　会话　字段状态　问答记录　诊前档案　归档状态　审计记录</text></g><text x="68" y="620" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700" fill="#155348">关键设计：模型负责“理解”，规则负责“决定”。</text><text x="1136" y="670" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#566762">04</text></svg>
