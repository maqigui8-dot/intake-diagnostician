<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F5EF"/><text x="68" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="700" fill="#155348">结构化字段与信息来源</text><g id="fields" font-family="Microsoft YaHei, Arial, sans-serif"><text x="68" y="150" font-size="15" font-weight="700" fill="#C86A3A">采集范围</text><text x="68" y="202" font-size="23" font-weight="700" fill="#263D38">基础测量</text><text x="68" y="230" font-size="15" fill="#566762">年龄、身高、体重、腰围</text><text x="68" y="286" font-size="23" font-weight="700" fill="#263D38">病程信息</text><text x="68" y="314" font-size="15" fill="#566762">变化经过、相关因素、管理经历</text><text x="68" y="370" font-size="23" font-weight="700" fill="#263D38">中医症状</text><text x="68" y="398" font-size="15" fill="#566762">食欲口渴、二便、睡眠情绪、疲劳</text><text x="68" y="454" font-size="23" font-weight="700" fill="#263D38">生活方式</text><text x="68" y="482" font-size="15" fill="#566762">饮食、运动、作息、压力性进食</text><text x="68" y="538" font-size="23" font-weight="700" fill="#C86A3A">安全信息</text><text x="68" y="566" font-size="15" fill="#566762">过敏、用药、病史、妊娠、危险信号</text></g><line x1="495" y1="140" x2="495" y2="580" stroke="#BFCFC9"/><g id="source-chain" font-family="Microsoft YaHei, Arial, sans-serif"><text x="550" y="150" font-size="15" font-weight="700" fill="#C86A3A">问题来源</text><rect x="550" y="190" width="500" height="64" fill="#EFEEE8"/><text x="575" y="219" font-size="19" font-weight="700" fill="#263D38">字段定义</text><text x="575" y="242" font-size="14" fill="#566762">标准问题、优先级、核心属性、最大尝试次数</text><line x1="800" y1="254" x2="800" y2="286" stroke="#BFCFC9" stroke-width="2"/><polygon points="800,286 792,270 808,270" fill="#BFCFC9"/><rect x="610" y="286" width="500" height="64" fill="#F7F5EF" stroke="#D7DEDA"/><text x="635" y="315" font-size="19" font-weight="700" fill="#263D38">Agent 提取证据</text><text x="635" y="338" font-size="14" fill="#566762">字段值、患者原文、信息来源、回答质量</text><line x1="860" y1="350" x2="860" y2="382" stroke="#BFCFC9" stroke-width="2"/><polygon points="860,382 852,366 868,366" fill="#BFCFC9"/><rect x="670" y="382" width="500" height="64" fill="#EFEEE8"/><text x="695" y="411" font-size="19" font-weight="700" fill="#263D38">规则更新状态</text><text x="695" y="434" font-size="14" fill="#566762">确认、部分获取、无法提供、不适用或冲突</text><line x1="920" y1="446" x2="920" y2="478" stroke="#C86A3A" stroke-width="2"/><polygon points="920,478 912,462 928,462" fill="#C86A3A"/><rect x="730" y="478" width="440" height="76" fill="#155348"/><text x="755" y="509" font-size="20" font-weight="700" fill="#F7F5EF">规则选择目标字段</text><text x="755" y="535" font-size="15" fill="#F7F5EF">Agent 只把目标字段表达成自然问题</text></g><text x="550" y="606" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#155348">问题顺序可以变化，但每个问题的目标和来源始终可追踪。</text><text x="1136" y="670" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#566762">07</text></svg>
