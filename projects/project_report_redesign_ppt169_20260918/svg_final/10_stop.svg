<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F5EF"/><text x="68" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="700" fill="#155348">何时停止追问</text><g id="tree" font-family="Microsoft YaHei, Arial, sans-serif"><rect x="420" y="132" width="440" height="88" fill="#155348"/><text x="640" y="169" text-anchor="middle" font-size="22" font-weight="700" fill="#F7F5EF">当前信息是否仍需要并适合在线追问？</text><text x="640" y="197" text-anchor="middle" font-size="14" fill="#F7F5EF">核心字段　安全缺口　冲突　尝试次数　回答质量</text><line x1="640" y1="220" x2="640" y2="266" stroke="#BFCFC9" stroke-width="2"/><line x1="212" y1="266" x2="1068" y2="266" stroke="#BFCFC9" stroke-width="2"/><line x1="212" y1="266" x2="212" y2="312" stroke="#BFCFC9" stroke-width="2"/><line x1="640" y1="266" x2="640" y2="312" stroke="#BFCFC9" stroke-width="2"/><line x1="1068" y1="266" x2="1068" y2="312" stroke="#C86A3A" stroke-width="2"/>
<text x="212" y="292" text-anchor="middle" font-size="14" fill="#566762">仍有关键缺口</text><text x="640" y="292" text-anchor="middle" font-size="14" fill="#566762">核心信息满足</text><text x="1068" y="292" text-anchor="middle" font-size="14" fill="#C86A3A">在线采集失效</text><rect x="68" y="312" width="288" height="220" fill="#F7F5EF" stroke="#D7DEDA"/><text x="92" y="354" font-size="23" font-weight="700" fill="#263D38">继续追问</text><text x="92" y="397" font-size="16" fill="#566762">核心字段仍缺失</text><text x="92" y="431" font-size="16" fill="#566762">安全信息尚未确认</text><text x="92" y="465" font-size="16" fill="#566762">冲突仍可在线澄清</text><rect x="496" y="312" width="288" height="220" fill="#EFEEE8"/><text x="520" y="354" font-size="23" font-weight="700" fill="#155348">正常结束</text><text x="520" y="397" font-size="16" fill="#566762">核心字段已经完整</text><text x="520" y="431" font-size="16" fill="#566762">无关键安全缺口</text><text x="520" y="465" font-size="16" fill="#566762">无未解决冲突</text><rect x="924" y="312" width="288" height="220" fill="#F7F5EF" stroke="#C86A3A" stroke-width="2"/><text x="948" y="354" font-size="23" font-weight="700" fill="#C86A3A">保护性结束</text><text x="948" y="397" font-size="16" fill="#566762">多次无法回答或问题重复</text><text x="948" y="431" font-size="16" fill="#566762">剩余内容不宜在线采集</text><text x="948" y="465" font-size="16" fill="#566762">AI 暂不可用或出现风险</text><text x="948" y="505" font-size="14" font-weight="700" fill="#C86A3A">停止追问 ≠ 资料完整</text></g><text x="68" y="594" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700" fill="#155348">系统不依赖固定轮数，而是依据核心完整度和在线可采集性决定结束时机。</text><text x="1136" y="670" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#566762">10</text></svg>
