<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F5EF" /><text x="68" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="700" fill="#155348">追问优先级与决策机制</text><g id="stairs" font-family="Microsoft YaHei, Arial, sans-serif"><rect x="68" y="470" width="480" height="76" fill="#EFEEE8" /><rect x="128" y="394" width="420" height="76" fill="#EFEEE8" /><rect x="188" y="318" width="360" height="76" fill="#EFEEE8" /><rect x="248" y="242" width="300" height="76" fill="#EFEEE8" /><rect x="308" y="166" width="240" height="76" fill="#C86A3A" /><text x="92" y="515" font-size="18" font-weight="700" fill="#263D38">05　可选补充信息</text><text x="152" y="439" font-size="18" font-weight="700" fill="#263D38">04　高优先级普通字段</text><text x="212" y="363" font-size="18" font-weight="700" fill="#263D38">03　冲突与澄清字段</text><text x="272" y="287" font-size="18" font-weight="700" fill="#263D38">02　未完成核心字段</text><text x="328" y="211" font-size="18" font-weight="700" fill="#F7F5EF">01　危险信号</text><text x="68" y="584" font-size="15" fill="#7B8783">已确认、不适用或达到尝试上限的字段不再进入候选集合。</text></g><g id="example" font-family="Microsoft YaHei, Arial, sans-serif"><text x="650" y="166" font-size="15" font-weight="700" fill="#C86A3A">选择示例</text><text fill="#263D38" font-size="26" font-weight="700" x="650" y="215">“用药信息”和“运动情况”</text><text fill="#263D38" font-size="26" font-weight="700" x="650" y="255">同时缺失时，先问什么？</text><line x1="650" y1="290" x2="1160" y2="290" stroke="#BFCFC9" /><text x="650" y="337" font-size="17" fill="#566762">规则比较安全属性、核心属性和优先级</text><text x="650" y="382" font-size="18" font-weight="700" fill="#155348">目标字段：用药信息</text><line x1="650" y1="410" x2="1160" y2="410" stroke="#D7DEDA" /><text x="650" y="455" font-size="17" fill="#566762">Agent 将目标字段组织成自然问题</text><text x="650" y="504" font-size="23" font-weight="700" fill="#263D38">“您目前有长期服用的药物吗？”</text><text x="650" y="558" font-size="15" fill="#7B8783">规则决定问什么，Agent 决定怎么问。</text></g><text x="1136" y="670" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#566762">09</text></svg>