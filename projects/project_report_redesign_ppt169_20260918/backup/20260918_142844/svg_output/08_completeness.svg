<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F5EF"/><text x="68" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="700" fill="#155348">资料完整度如何判断</text><g id="inputs" font-family="Microsoft YaHei, Arial, sans-serif"><text x="68" y="160" font-size="15" font-weight="700" fill="#C86A3A">字段状态输入</text><text x="68" y="212" font-size="18" fill="#566762">尚未询问</text><text x="68" y="270" font-size="18" fill="#566762">部分获取</text><text x="68" y="328" font-size="18" font-weight="700" fill="#155348">已经确认</text><text x="68" y="386" font-size="18" fill="#566762">无法提供</text><text x="68" y="444" font-size="18" fill="#566762">不适用</text><line x1="230" y1="205" x2="440" y2="310" stroke="#BFCFC9"/><line x1="230" y1="263" x2="440" y2="320" stroke="#BFCFC9"/><line x1="230" y1="321" x2="440" y2="330" stroke="#BFCFC9"/><line x1="230" y1="379" x2="440" y2="340" stroke="#BFCFC9"/><line x1="230" y1="437" x2="440" y2="350" stroke="#BFCFC9"/></g><g id="evaluator" font-family="Microsoft YaHei, Arial, sans-serif"><circle cx="585" cy="330" r="145" fill="#155348"/><text x="585" y="282" text-anchor="middle" font-size="25" font-weight="700" fill="#F7F5EF">完整度判断器</text><line x1="505" y1="306" x2="665" y2="306" stroke="#BFCFC9"/><text x="585" y="340" text-anchor="middle" font-size="16" fill="#F7F5EF">基础测量是否完成</text><text x="585" y="370" text-anchor="middle" font-size="16" fill="#F7F5EF">核心与安全字段是否缺失</text><text x="585" y="400" text-anchor="middle" font-size="16" fill="#F7F5EF">是否存在未解决冲突</text></g><g id="outputs" font-family="Microsoft YaHei, Arial, sans-serif"><line x1="730" y1="330" x2="830" y2="205" stroke="#BFCFC9" stroke-width="2"/><line x1="730" y1="330" x2="830" y2="330" stroke="#BFCFC9" stroke-width="2"/><line x1="730" y1="330" x2="830" y2="455" stroke="#C86A3A" stroke-width="2"/><rect x="830" y="160" width="330" height="90" fill="#F7F5EF" stroke="#D7DEDA"/><text x="855" y="196" font-size="21" font-weight="700" fill="#263D38">继续追问</text><text x="855" y="224" font-size="15" fill="#566762">关键缺口仍存在且可以继续采集</text><rect x="830" y="285" width="330" height="90" fill="#EFEEE8"/><text x="855" y="321" font-size="21" font-weight="700" fill="#155348">正常结束</text><text x="855" y="349" font-size="15" fill="#566762">核心信息可用、无安全缺口与冲突</text><rect x="830" y="410" width="330" height="90" fill="#F7F5EF" stroke="#C86A3A" stroke-width="2"/><text x="855" y="446" font-size="21" font-weight="700" fill="#C86A3A">保护性结束</text><text x="855" y="474" font-size="15" fill="#566762">在线采集失效，保存结果交由医生补充</text></g><g id="takeaway"><rect x="68" y="560" width="1092" height="64" fill="#EFEEE8"/><text x="92" y="599" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#155348">完整不等于“所有字段填满”，而是核心信息可用、安全缺口已处理、没有阻塞性冲突。</text></g><text x="1136" y="670" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#566762">08</text></svg>
