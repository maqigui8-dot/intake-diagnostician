<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F5EF"/><text x="68" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="700" fill="#155348">系统角色与主要功能</text><g id="roles" font-family="Microsoft YaHei, Arial, sans-serif"><circle cx="220" cy="300" r="92" fill="#155348"/><text x="220" y="294" text-anchor="middle" font-size="27" font-weight="700" fill="#F7F5EF">患者端</text><text x="220" y="328" text-anchor="middle" font-size="15" fill="#F7F5EF">提供信息</text><line x1="312" y1="300" x2="494" y2="300" stroke="#BFCFC9" stroke-width="3"/><polygon points="494,300 478,292 478,308" fill="#BFCFC9"/><rect x="494" y="218" width="292" height="164" fill="#EFEEE8"/><text x="640" y="258" text-anchor="middle" font-size="22" font-weight="700" fill="#263D38">系统整理</text><text x="640" y="293" text-anchor="middle" font-size="16" fill="#566762">字段状态与原文证据</text><text x="640" y="323" text-anchor="middle" font-size="16" fill="#566762">完整度、缺口与停止原因</text><text x="640" y="353" text-anchor="middle" font-size="16" fill="#566762">结构化诊前档案</text><line x1="786" y1="300" x2="968" y2="300" stroke="#BFCFC9" stroke-width="3"/><polygon points="968,300 952,292 952,308" fill="#BFCFC9"/><circle cx="1060" cy="300" r="92" fill="#C86A3A"/><text x="1060" y="294" text-anchor="middle" font-size="27" font-weight="700" fill="#F7F5EF">医生端</text><text x="1060" y="328" text-anchor="middle" font-size="15" fill="#F7F5EF">查看与理解</text>
<text x="94" y="458" font-size="18" font-weight="700" fill="#263D38">身份选择　基础资料　开放描述</text><text x="94" y="489" font-size="16" fill="#566762">逐项回答、恢复未完成问诊、查看历史档案</text><text x="824" y="458" font-size="18" font-weight="700" fill="#263D38">患者列表　历史问诊　问答详情</text><text x="824" y="489" font-size="16" fill="#566762">查看关键缺口、追问来源、完整度和停止原因</text></g><g id="boundary"><line x1="68" y1="552" x2="1160" y2="552" stroke="#BFCFC9"/><text x="68" y="590" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#155348">数据边界</text><text x="168" y="590" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#566762">会话和档案显式绑定 patient_id；跨患者读取返回 404；医生端当前保持只读。</text></g><text x="1136" y="670" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#566762">05</text></svg>
