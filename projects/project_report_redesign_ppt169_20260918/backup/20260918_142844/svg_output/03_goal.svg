<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F5EF"/><text x="68" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="700" fill="#155348">项目目标与定位</text><g id="goal-map" font-family="Microsoft YaHei, Arial, sans-serif"><circle cx="640" cy="320" r="112" fill="#155348"/><text x="640" y="308" text-anchor="middle" font-size="25" font-weight="700" fill="#F7F5EF">诊前资料</text><text x="640" y="344" text-anchor="middle" font-size="25" font-weight="700" fill="#F7F5EF">整理</text><line x1="528" y1="270" x2="382" y2="215" stroke="#BFCFC9" stroke-width="2"/><line x1="752" y1="270" x2="898" y2="215" stroke="#BFCFC9" stroke-width="2"/><line x1="528" y1="370" x2="382" y2="425" stroke="#BFCFC9" stroke-width="2"/><line x1="752" y1="370" x2="898" y2="425" stroke="#BFCFC9" stroke-width="2"/><text x="90" y="190" font-size="15" font-weight="700" fill="#C86A3A">01</text><text x="130" y="190" font-size="22" font-weight="700" fill="#263D38">自然语言结构化</text><text x="130" y="220" font-size="16" fill="#566762">把患者表达映射到明确字段</text><text x="920" y="190" font-size="15" font-weight="700" fill="#C86A3A">02</text><text x="960" y="190" font-size="22" font-weight="700" fill="#263D38">有限追问</text><text x="960" y="220" font-size="16" fill="#566762">只询问仍有价值的缺口</text><text x="90" y="430" font-size="15" font-weight="700" fill="#C86A3A">03</text><text x="130" y="430" font-size="22" font-weight="700" fill="#263D38">停止判断</text><text x="130" y="460" font-size="16" fill="#566762">根据核心完整度及时结束</text><text x="920" y="430" font-size="15" font-weight="700" fill="#C86A3A">04</text><text x="960" y="430" font-size="22" font-weight="700" fill="#263D38">结果可追溯</text><text x="960" y="460" font-size="16" fill="#566762">向医生解释来源与原因</text></g><g id="boundary"><line x1="68" y1="548" x2="1160" y2="548" stroke="#BFCFC9"/><text x="68" y="584" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700" fill="#C86A3A">能力边界</text><text x="190" y="584" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#566762">不自动诊断　不输出患病概率　不自动开方　不替代医生面诊</text><text x="68" y="622" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#155348">定位：为医生提供更完整的诊前资料，而不是给患者提供最终医疗结论。</text></g><text x="1136" y="670" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#566762">03</text></svg>
