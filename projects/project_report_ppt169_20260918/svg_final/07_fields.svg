<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F5EF"/><g id="header"><text x="68" y="82" font-family="Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="700" fill="#155348">结构化字段与信息来源</text><line x1="68" y1="106" x2="150" y2="106" stroke="#C86A3A" stroke-width="4"/></g>
<g id="categories" font-family="Microsoft YaHei, Arial, sans-serif"><text x="68" y="172" font-size="15" font-weight="700" fill="#C86A3A">FIELD CATEGORIES</text><line x1="68" y1="197" x2="1160" y2="197" stroke="#BFCFC9"/>
<text x="68" y="244" font-size="21" font-weight="700" fill="#155348">基础测量</text><text x="68" y="278" font-size="16" fill="#566762">年龄、性别、身高、体重、腰围</text><text x="290" y="244" font-size="21" font-weight="700" fill="#155348">病程信息</text><text x="290" y="278" font-size="16" fill="#566762">变化经过、相关因素、管理经历</text><text x="530" y="244" font-size="21" font-weight="700" fill="#155348">中医症状</text><text x="530" y="278" font-size="16" fill="#566762">食欲口渴、二便、睡眠情绪、疲劳</text><text x="790" y="244" font-size="21" font-weight="700" fill="#155348">生活方式</text><text x="790" y="278" font-size="16" fill="#566762">饮食、运动、作息、压力性进食</text><text x="1018" y="244" font-size="21" font-weight="700" fill="#155348">安全信息</text><text x="1018" y="278" font-size="16" fill="#566762">过敏、用药、病史、妊娠、危险信号</text></g>
<g id="source"><rect x="68" y="345" width="1092" height="230" fill="#EFEEE8"/><text x="92" y="390" font-family="Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="700" fill="#263D38">问题从哪里来？</text><text x="92" y="437" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#566762">每个字段预先定义：标准问题、优先级、是否核心、最大尝试次数、适用条件。</text><text x="92" y="475" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#566762">Agent 从患者回答中提取“字段值 + 原文证据 + 信息来源”，规则再判断字段是否已确认。</text><text x="92" y="513" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#566762">下一问只从仍有缺口、仍可在线采集且未达到尝试上限的字段中选择。</text><text x="92" y="551" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#155348">因此，问题顺序可以变化，但问题目标和选择依据始终可追踪。</text></g><text x="1136" y="670" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#566762">07</text></svg>
