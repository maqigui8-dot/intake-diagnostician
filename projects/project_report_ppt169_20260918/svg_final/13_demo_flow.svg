<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F5EF"/><g id="header"><text x="68" y="82" font-family="Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="700" fill="#155348">项目操作展示：问诊过程</text><line x1="68" y1="106" x2="150" y2="106" stroke="#C86A3A" stroke-width="4"/></g>
<g id="screens" font-family="Microsoft YaHei, Arial, sans-serif"><rect x="68" y="158" width="338" height="330" fill="#EFEEE8" stroke="#BFCFC9" stroke-width="2" stroke-dasharray="8,4"/><text x="237" y="305" text-anchor="middle" font-size="20" font-weight="700" fill="#155348">截图 1</text><text x="237" y="338" text-anchor="middle" font-size="16" fill="#566762">开放描述</text><text x="426" y="330" font-size="25" fill="#C86A3A">→</text><rect x="471" y="158" width="338" height="330" fill="#EFEEE8" stroke="#BFCFC9" stroke-width="2" stroke-dasharray="8,4"/><text x="640" y="305" text-anchor="middle" font-size="20" font-weight="700" fill="#155348">截图 2</text><text x="640" y="338" text-anchor="middle" font-size="16" fill="#566762">逐项补充追问</text><text x="829" y="330" font-size="25" fill="#C86A3A">→</text><rect x="874" y="158" width="338" height="330" fill="#EFEEE8" stroke="#BFCFC9" stroke-width="2" stroke-dasharray="8,4"/><text x="1043" y="305" text-anchor="middle" font-size="20" font-weight="700" fill="#155348">截图 3</text><text x="1043" y="338" text-anchor="middle" font-size="16" fill="#566762">完成后的诊前档案</text></g>
<g id="flow"><rect x="68" y="536" width="1144" height="78" fill="#F7F5EF" stroke="#D7DEDA"/><text x="640" y="571" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#263D38">自由描述 → 信息抽取 → 单项追问 → 完整度更新 → 生成档案</text><text x="640" y="598" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#7B8783">演示时建议选择一个字段变化，说明它如何影响下一问与停止判断。</text></g><text x="1136" y="670" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#566762">13</text></svg>
