<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F5EF"/><g id="header"><text x="68" y="82" font-family="Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="700" fill="#155348">系统角色与主要功能</text><line x1="68" y1="106" x2="150" y2="106" stroke="#C86A3A" stroke-width="4"/></g>
<g id="patient" font-family="Microsoft YaHei, Arial, sans-serif"><text x="68" y="174" font-size="15" font-weight="700" fill="#C86A3A">PATIENT</text><text x="68" y="214" font-size="27" font-weight="700" fill="#263D38">患者端：提供信息</text><line x1="68" y1="239" x2="572" y2="239" stroke="#BFCFC9"/><text x="68" y="286" font-size="19" fill="#566762">身份选择与患者切换</text><text x="68" y="330" font-size="19" fill="#566762">基础资料和开放描述</text><text x="68" y="374" font-size="19" fill="#566762">逐项追问与回答确认</text><text x="68" y="418" font-size="19" fill="#566762">未完成问诊恢复与历史档案</text></g>
<line x1="614" y1="154" x2="614" y2="510" stroke="#D7DEDA"/>
<g id="doctor" font-family="Microsoft YaHei, Arial, sans-serif"><text x="660" y="174" font-size="15" font-weight="700" fill="#C86A3A">DOCTOR</text><text x="660" y="214" font-size="27" font-weight="700" fill="#263D38">医生端：查看与理解</text><line x1="660" y1="239" x2="1160" y2="239" stroke="#BFCFC9"/><text x="660" y="286" font-size="19" fill="#566762">患者列表、历史问诊和基础资料</text><text x="660" y="330" font-size="19" fill="#566762">开放描述与逐轮问答记录</text><text x="660" y="374" font-size="19" fill="#566762">完整度、关键缺口和追问来源</text><text x="660" y="418" font-size="19" fill="#566762">停止原因与诊前档案，只读呈现</text></g>
<g id="boundary"><rect x="68" y="536" width="1092" height="82" fill="#EFEEE8"/><text x="92" y="570" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700" fill="#155348">数据边界</text><text x="92" y="598" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#566762">每个会话与档案显式绑定 patient_id；跨患者访问返回 404。医生端第一版保持只读，不修改患者原始回答。</text></g><text x="1136" y="670" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#566762">05</text></svg>
