<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F5EF"/><g id="header"><text x="68" y="82" font-family="Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="700" fill="#155348">资料完整度如何判断</text><line x1="68" y1="106" x2="150" y2="106" stroke="#C86A3A" stroke-width="4"/></g>
<g id="states" font-family="Microsoft YaHei, Arial, sans-serif"><text x="68" y="166" font-size="24" font-weight="700" fill="#263D38">字段状态</text><line x1="68" y1="192" x2="500" y2="192" stroke="#BFCFC9"/><text x="68" y="242" font-size="18" fill="#566762">01　尚未询问</text><text x="68" y="288" font-size="18" fill="#566762">02　部分获取</text><text x="68" y="334" font-size="18" font-weight="700" fill="#155348">03　已经确认</text><text x="68" y="380" font-size="18" fill="#566762">04　无法提供</text><text x="68" y="426" font-size="18" fill="#566762">05　不适用</text></g>
<line x1="540" y1="154" x2="540" y2="505" stroke="#D7DEDA"/>
<g id="rules" font-family="Microsoft YaHei, Arial, sans-serif"><text x="590" y="166" font-size="24" font-weight="700" fill="#263D38">结束判断清单</text><line x1="590" y1="192" x2="1160" y2="192" stroke="#BFCFC9"/><text x="590" y="242" font-size="18" fill="#566762">基础测量是否完成</text><text x="590" y="288" font-size="18" fill="#566762">核心病程与安全字段是否仍有缺口</text><text x="590" y="334" font-size="18" fill="#566762">是否存在尚未澄清的信息冲突</text><text x="590" y="380" font-size="18" fill="#566762">剩余内容是否适合继续在线采集</text><text x="590" y="426" font-size="18" fill="#566762">可选字段是否已经达到合理边界</text><text x="590" y="472" font-size="18" font-weight="700" fill="#155348">每次回答后重新计算完成数与关键缺口</text></g>
<g id="takeaway"><rect x="68" y="548" width="1092" height="72" fill="#EFEEE8"/><text x="92" y="591" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="700" fill="#155348">完整度 = 核心信息可用 + 安全缺口已处理 + 无阻塞性冲突，而不是所有可选字段全部完成。</text></g><text x="1136" y="670" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#566762">08</text></svg>
