<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F5EF"/><g id="header"><text x="68" y="82" font-family="Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="700" fill="#155348">项目目标与定位</text><line x1="68" y1="106" x2="150" y2="106" stroke="#C86A3A" stroke-width="4"/></g>
<g id="goals" font-family="Microsoft YaHei, Arial, sans-serif"><text x="68" y="166" font-size="15" font-weight="700" fill="#C86A3A">PROJECT GOALS</text><text x="68" y="208" font-size="25" font-weight="700" fill="#263D38">项目目标</text><line x1="68" y1="230" x2="1160" y2="230" stroke="#BFCFC9"/>
<text x="88" y="278" font-size="20" font-weight="700" fill="#155348">01</text><text x="140" y="278" font-size="19" fill="#263D38">把患者自然语言整理为结构化诊前资料</text><text x="650" y="278" font-size="20" font-weight="700" fill="#155348">03</text><text x="702" y="278" font-size="19" fill="#263D38">以核心信息完整度决定何时停止</text>
<text x="88" y="333" font-size="20" font-weight="700" fill="#155348">02</text><text x="140" y="333" font-size="19" fill="#263D38">根据缺失字段选择下一项追问并避免重复</text><text x="650" y="333" font-size="20" font-weight="700" fill="#155348">04</text><text x="702" y="333" font-size="19" fill="#263D38">向医生展示可追溯、可解释的问诊结果</text></g>
<g id="boundary"><rect x="68" y="395" width="1092" height="190" fill="#EFEEE8"/><text x="92" y="438" font-family="Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="700" fill="#263D38">能力边界</text><text x="92" y="484" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#566762">不自动诊断　　不输出患病概率　　不自动开方　　不替代医生面诊</text><line x1="92" y1="510" x2="1136" y2="510" stroke="#D7DEDA"/><text x="92" y="548" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#155348">系统定位：诊前资料采集与整理工具，为医生节省信息确认时间，而不是给出最终医疗结论。</text></g><text x="1136" y="670" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#566762">03</text></svg>
