<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F5EF"/>
<g id="header"><text x="68" y="82" font-family="Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="700" fill="#155348">项目背景与问题</text><line x1="68" y1="106" x2="150" y2="106" stroke="#C86A3A" stroke-width="4"/></g>
<g id="intro"><text x="68" y="180" font-family="Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="700" fill="#263D38"><tspan x="68">诊前信息往往“说得很多”，</tspan><tspan x="68" dy="40">但仍难直接用于医疗沟通。</tspan></text><text x="68" y="286" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#566762"><tspan x="68">患者按自己的感受自然表达，信息散落在多轮对话中；</tspan><tspan x="68" dy="30">医生则需要快速确认病程、安全信息和生活方式等关键内容。</tspan></text></g>
<line x1="525" y1="154" x2="525" y2="536" stroke="#BFCFC9" stroke-width="1"/>
<g id="issues" font-family="Microsoft YaHei, Arial, sans-serif"><text x="570" y="178" font-size="15" font-weight="700" fill="#C86A3A">01</text><text x="620" y="178" font-size="21" font-weight="700" fill="#263D38">描述零散</text><text x="620" y="207" font-size="17" fill="#566762">自然表达容易遗漏时间、程度和关联因素。</text><line x1="570" y1="232" x2="1160" y2="232" stroke="#D7DEDA"/>
<text x="570" y="275" font-size="15" font-weight="700" fill="#C86A3A">02</text><text x="620" y="275" font-size="21" font-weight="700" fill="#263D38">重复询问</text><text x="620" y="304" font-size="17" fill="#566762">缺少字段状态记录时，同一问题可能反复出现。</text><line x1="570" y1="329" x2="1160" y2="329" stroke="#D7DEDA"/>
<text x="570" y="372" font-size="15" font-weight="700" fill="#C86A3A">03</text><text x="620" y="372" font-size="21" font-weight="700" fill="#263D38">停止条件不清</text><text x="620" y="401" font-size="17" fill="#566762">可选细节持续阻塞结束，导致问诊轮数过多。</text><line x1="570" y1="426" x2="1160" y2="426" stroke="#D7DEDA"/>
<text x="570" y="469" font-size="15" font-weight="700" fill="#C86A3A">04</text><text x="620" y="469" font-size="21" font-weight="700" fill="#263D38">决策不可解释</text><text x="620" y="498" font-size="17" fill="#566762">医生难以理解为什么追问、为什么在此时结束。</text></g>
<g id="takeaway"><rect x="68" y="575" width="1092" height="58" fill="#EFEEE8"/><text x="92" y="611" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="700" fill="#155348">项目需求：结构化采集 · 有限追问 · 及时停止 · 决策过程可解释</text></g><text x="1136" y="670" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#566762">02</text></svg>
