<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F5EF"/><g id="header"><text x="68" y="82" font-family="Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="700" fill="#155348">系统整体架构</text><line x1="68" y1="106" x2="150" y2="106" stroke="#C86A3A" stroke-width="4"/></g>
<g id="layers" font-family="Microsoft YaHei, Arial, sans-serif">
<rect x="68" y="150" width="112" height="92" fill="#155348"/><text x="124" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#F7F5EF">交互层</text><text x="124" y="215" text-anchor="middle" font-size="13" fill="#F7F5EF">01</text><rect x="180" y="150" width="980" height="92" fill="#EFEEE8"/><text x="210" y="186" font-size="21" font-weight="700" fill="#263D38">Vue 3 患者端　｜　独立医生工作台</text><text x="210" y="216" font-size="16" fill="#566762">完成身份选择、问诊交互、档案查看与多患者切换。</text>
<rect x="68" y="254" width="112" height="92" fill="#155348"/><text x="124" y="294" text-anchor="middle" font-size="16" font-weight="700" fill="#F7F5EF">接口层</text><text x="124" y="319" text-anchor="middle" font-size="13" fill="#F7F5EF">02</text><rect x="180" y="254" width="980" height="92" fill="#F7F5EF" stroke="#D7DEDA"/><text x="210" y="290" font-size="21" font-weight="700" fill="#263D38">FastAPI 服务</text><text x="210" y="320" font-size="16" fill="#566762">提供患者隔离接口、问诊会话接口和医生只读查询接口。</text>
<rect x="68" y="358" width="112" height="116" fill="#C86A3A"/><text x="124" y="406" text-anchor="middle" font-size="16" font-weight="700" fill="#F7F5EF">决策层</text><text x="124" y="431" text-anchor="middle" font-size="13" fill="#F7F5EF">03</text><rect x="180" y="358" width="980" height="116" fill="#EFEEE8"/><text x="210" y="396" font-size="21" font-weight="700" fill="#263D38">Agent 信息抽取　＋　确定性规则引擎</text><text x="210" y="428" font-size="16" fill="#566762">字段状态、完整度、下一问、停止原因由规则统一约束。</text><text x="210" y="452" font-size="15" fill="#155348">核心原则：大模型负责理解与表达，规则系统负责决策与边界。</text>
<rect x="68" y="486" width="112" height="92" fill="#155348"/><text x="124" y="526" text-anchor="middle" font-size="16" font-weight="700" fill="#F7F5EF">数据层</text><text x="124" y="551" text-anchor="middle" font-size="13" fill="#F7F5EF">04</text><rect x="180" y="486" width="980" height="92" fill="#F7F5EF" stroke="#D7DEDA"/><text x="210" y="522" font-size="21" font-weight="700" fill="#263D38">MySQL 完整持久化</text><text x="210" y="552" font-size="16" fill="#566762">保存患者、会话、字段、问答、档案、归档状态与审计记录。</text></g>
<g id="footer"><line x1="68" y1="626" x2="1160" y2="626" stroke="#BFCFC9"/><text x="68" y="652" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#7B8783">四层职责解耦，便于前后端独立演示，也便于后续替换模型或扩展业务规则。</text><text x="1136" y="670" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#566762">04</text></g></svg>
