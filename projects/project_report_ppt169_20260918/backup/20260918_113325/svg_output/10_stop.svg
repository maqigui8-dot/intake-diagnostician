<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F5EF"/><g id="header"><text x="68" y="82" font-family="Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="700" fill="#155348">何时停止追问</text><line x1="68" y1="106" x2="150" y2="106" stroke="#C86A3A" stroke-width="4"/></g>
<g id="decision" font-family="Microsoft YaHei, Arial, sans-serif"><rect x="455" y="160" width="370" height="86" fill="#155348"/><text x="640" y="195" text-anchor="middle" font-size="21" font-weight="700" fill="#F7F5EF">当前信息还能产生有效追问吗？</text><text x="640" y="222" text-anchor="middle" font-size="14" fill="#F7F5EF">检查核心字段、安全缺口、冲突和尝试次数</text>
<line x1="640" y1="246" x2="640" y2="294" stroke="#BFCFC9" stroke-width="2"/><line x1="220" y1="294" x2="1060" y2="294" stroke="#BFCFC9" stroke-width="2"/><line x1="220" y1="294" x2="220" y2="332" stroke="#BFCFC9" stroke-width="2"/><line x1="640" y1="294" x2="640" y2="332" stroke="#BFCFC9" stroke-width="2"/><line x1="1060" y1="294" x2="1060" y2="332" stroke="#BFCFC9" stroke-width="2"/>
<text x="220" y="320" text-anchor="middle" font-size="14" fill="#C86A3A">仍有关键缺口</text><text x="640" y="320" text-anchor="middle" font-size="14" fill="#155348">核心信息已满足</text><text x="1060" y="320" text-anchor="middle" font-size="14" fill="#C86A3A">在线采集已失效</text>
<rect x="68" y="332" width="304" height="210" fill="#F7F5EF" stroke="#D7DEDA"/><text x="92" y="376" font-size="23" font-weight="700" fill="#263D38">继续追问</text><text x="92" y="420" font-size="17" fill="#566762">• 核心字段仍缺失</text><text x="92" y="455" font-size="17" fill="#566762">• 安全信息尚未确认</text><text x="92" y="490" font-size="17" fill="#566762">• 冲突仍可在线澄清</text>
<rect x="488" y="332" width="304" height="210" fill="#EFEEE8"/><text x="512" y="376" font-size="23" font-weight="700" fill="#155348">正常结束</text><text x="512" y="420" font-size="17" fill="#566762">• 核心字段完整</text><text x="512" y="455" font-size="17" fill="#566762">• 无关键安全缺口</text><text x="512" y="490" font-size="17" fill="#566762">• 无未解决冲突</text>
<rect x="908" y="332" width="304" height="210" fill="#F7F5EF" stroke="#D7DEDA"/><text x="932" y="376" font-size="23" font-weight="700" fill="#C86A3A">保护性结束</text><text x="932" y="420" font-size="17" fill="#566762">• 多次无法回答 / 问题重复</text><text x="932" y="455" font-size="17" fill="#566762">• 剩余内容不宜在线采集</text><text x="932" y="490" font-size="17" fill="#566762">• AI 暂不可用或出现风险</text></g>
<text x="68" y="600" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700" fill="#155348">保护性结束会保存当前结果并交由医生补充；它代表“停止继续询问”，不代表“资料已经完整”。</text><text x="1136" y="670" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#566762">10</text></svg>
