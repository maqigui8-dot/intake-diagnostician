<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F5EF"/><g id="header"><text x="68" y="82" font-family="Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="700" fill="#155348">项目实现中的关键难点</text><line x1="68" y1="106" x2="150" y2="106" stroke="#C86A3A" stroke-width="4"/></g>
<g id="table" font-family="Microsoft YaHei, Arial, sans-serif"><text x="68" y="162" font-size="15" font-weight="700" fill="#7B8783">难点</text><text x="360" y="162" font-size="15" font-weight="700" fill="#7B8783">解决方式</text><text x="1080" y="162" font-size="15" font-weight="700" fill="#7B8783">状态</text><line x1="68" y1="180" x2="1160" y2="180" stroke="#BFCFC9"/>
<text x="68" y="224" font-size="19" font-weight="700" fill="#263D38">追问轮数过多</text><text x="360" y="224" font-size="17" fill="#566762">从“全部字段完成”改为“核心字段驱动停止”，可选字段不再无限阻塞。</text><text x="1080" y="224" font-size="16" font-weight="700" fill="#155348">已实现</text><line x1="68" y1="258" x2="1160" y2="258" stroke="#D7DEDA"/>
<text x="68" y="306" font-size="19" font-weight="700" fill="#263D38">Agent 输出不稳定</text><text x="360" y="306" font-size="17" fill="#566762">Agent 提供字段与证据，确定性规则统一完成优先级和停止决策。</text><text x="1080" y="306" font-size="16" font-weight="700" fill="#155348">已实现</text><line x1="68" y1="340" x2="1160" y2="340" stroke="#D7DEDA"/>
<text x="68" y="388" font-size="19" font-weight="700" fill="#263D38">“不知道”导致重复</text><text x="360" y="388" font-size="17" fill="#566762">记录尝试次数与回答质量，达到上限后转交医生补充，不再追问。</text><text x="1080" y="388" font-size="16" font-weight="700" fill="#155348">已实现</text><line x1="68" y1="422" x2="1160" y2="422" stroke="#D7DEDA"/>
<text x="68" y="470" font-size="19" font-weight="700" fill="#263D38">多患者数据隔离</text><text x="360" y="470" font-size="17" fill="#566762">显式 patient_id、资源归属校验，跨患者读取返回 404。</text><text x="1080" y="470" font-size="16" font-weight="700" fill="#155348">已实现</text><line x1="68" y1="504" x2="1160" y2="504" stroke="#D7DEDA"/>
<rect x="68" y="548" width="1092" height="70" fill="#EFEEE8"/><text x="92" y="578" font-size="16" font-weight="700" fill="#C86A3A">当前边界</text><text x="208" y="578" font-size="16" fill="#566762">演示身份不等于正式鉴权；真实临床效果、规则覆盖范围和权限体系仍需进一步验证。</text></g><text x="1136" y="670" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#566762">11</text></svg>
