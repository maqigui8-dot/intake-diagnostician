<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F5EF"/><g id="header"><text x="68" y="82" font-family="Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="700" fill="#155348">项目操作展示：医生工作台与总结</text><line x1="68" y1="106" x2="150" y2="106" stroke="#C86A3A" stroke-width="4"/></g>
