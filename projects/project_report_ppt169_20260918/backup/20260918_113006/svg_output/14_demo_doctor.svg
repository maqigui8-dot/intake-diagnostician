<g id="closing"><line x1="68" y1="594" x2="1160" y2="594" stroke="#BFCFC9"/><text x="68" y="632" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#155348">项目通过规则约束 Agent，完成安全、可追踪、可解释的诊前信息整理。</text></g><text x="1136" y="670" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#566762">14</text></svg>
