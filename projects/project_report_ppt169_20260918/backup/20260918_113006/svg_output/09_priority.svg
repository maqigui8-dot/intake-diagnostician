<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F5EF"/><g id="header"><text x="68" y="82" font-family="Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="700" fill="#155348">追问优先级与决策机制</text><line x1="68" y1="106" x2="150" y2="106" stroke="#C86A3A" stroke-width="4"/></g>
<g id="priority" font-family="Microsoft YaHei, Arial, sans-serif"><line x1="112" y1="166" x2="112" y2="570" stroke="#BFCFC9" stroke-width="3"/>
<circle cx="112" cy="190" r="23" fill="#C86A3A"/><text x="112" y="197" text-anchor="middle" font-size="14" font-weight="700" fill="#F7F5EF">01</text><text x="158" y="185" font-size="20" font-weight="700" fill="#263D38">危险信号与安全字段</text><text x="158" y="211" font-size="15" fill="#566762">优先处理可能影响安全边界的信息</text>
<circle cx="112" cy="278" r="23" fill="#155348"/><text x="112" y="285" text-anchor="middle" font-size="14" font-weight="700" fill="#F7F5EF">02</text><text x="158" y="273" font-size="20" font-weight="700" fill="#263D38">尚未完成的核心字段</text><text x="158" y="299" font-size="15" fill="#566762">决定档案是否具备基本使用价值</text>
<circle cx="112" cy="366" r="23" fill="#155348"/><text x="112" y="373" text-anchor="middle" font-size="14" font-weight="700" fill="#F7F5EF">03</text><text x="158" y="361" font-size="20" font-weight="700" fill="#263D38">存在冲突、需要澄清的字段</text><text x="158" y="387" font-size="15" fill="#566762">避免前后回答不一致直接进入档案</text>
<circle cx="112" cy="454" r="23" fill="#155348"/><text x="112" y="461" text-anchor="middle" font-size="14" font-weight="700" fill="#F7F5EF">04</text><text x="158" y="449" font-size="20" font-weight="700" fill="#263D38">高优先级普通字段</text><text x="158" y="475" font-size="15" fill="#566762">补足医生常用但不阻塞结束的信息</text>
<circle cx="112" cy="542" r="23" fill="#155348"/><text x="112" y="549" text-anchor="middle" font-size="14" font-weight="700" fill="#F7F5EF">05</text><text x="158" y="537" font-size="20" font-weight="700" fill="#263D38">可选补充信息</text><text x="158" y="563" font-size="15" fill="#566762">在轮数允许且仍有价值时继续采集</text></g>
<g id="example"><rect x="700" y="166" width="460" height="404" fill="#EFEEE8"/><text x="730" y="210" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="700" fill="#263D38">选择示例</text><text x="730" y="256" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#566762"><tspan x="730">“用药信息”和“运动情况”同时缺失时，</tspan><tspan x="730" dy="30">规则先比较安全属性、核心属性和优先级。</tspan></text><line x1="730" y1="336" x2="1130" y2="336" stroke="#D7DEDA"/><text x="730" y="378" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#155348">规则选择目标字段：用药信息</text><text x="730" y="423" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#566762">Agent 生成自然表达：</text><text x="730" y="460" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#263D38">“您目前有长期服用的药物吗？”</text><text x="730" y="520" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#7B8783">已确认、不适用或达到尝试上限的字段不再询问。</text></g><text x="1136" y="670" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#566762">09</text></svg>
