<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F5EF"/><g id="header"><text x="68" y="82" font-family="Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="700" fill="#155348">完整问诊流程</text><line x1="68" y1="106" x2="150" y2="106" stroke="#C86A3A" stroke-width="4"/></g>
<g id="processFlow" font-family="Microsoft YaHei, Arial, sans-serif"><line x1="126" y1="310" x2="1112" y2="310" stroke="#BFCFC9" stroke-width="3"/>
<circle cx="126" cy="310" r="31" fill="#155348"/><circle cx="290" cy="310" r="31" fill="#155348"/><circle cx="454" cy="310" r="31" fill="#155348"/><circle cx="618" cy="310" r="31" fill="#C86A3A"/><circle cx="782" cy="310" r="31" fill="#155348"/><circle cx="946" cy="310" r="31" fill="#155348"/><circle cx="1110" cy="310" r="31" fill="#155348"/>
<text x="126" y="317" text-anchor="middle" font-size="16" font-weight="700" fill="#F7F5EF">01</text><text x="290" y="317" text-anchor="middle" font-size="16" font-weight="700" fill="#F7F5EF">02</text><text x="454" y="317" text-anchor="middle" font-size="16" font-weight="700" fill="#F7F5EF">03</text><text x="618" y="317" text-anchor="middle" font-size="16" font-weight="700" fill="#F7F5EF">04</text><text x="782" y="317" text-anchor="middle" font-size="16" font-weight="700" fill="#F7F5EF">05</text><text x="946" y="317" text-anchor="middle" font-size="16" font-weight="700" fill="#F7F5EF">06</text><text x="1110" y="317" text-anchor="middle" font-size="16" font-weight="700" fill="#F7F5EF">07</text>
<text x="126" y="246" text-anchor="middle" font-size="18" font-weight="700" fill="#263D38">选择患者</text><text x="290" y="246" text-anchor="middle" font-size="18" font-weight="700" fill="#263D38">基础资料</text><text x="454" y="246" text-anchor="middle" font-size="18" font-weight="700" fill="#263D38">开放描述</text><text x="618" y="246" text-anchor="middle" font-size="18" font-weight="700" fill="#263D38">Agent 提取</text><text x="782" y="246" text-anchor="middle" font-size="18" font-weight="700" fill="#263D38">字段更新</text><text x="946" y="246" text-anchor="middle" font-size="18" font-weight="700" fill="#263D38">完整度判断</text><text x="1110" y="246" text-anchor="middle" font-size="18" font-weight="700" fill="#263D38">追问 / 档案</text>
<text x="126" y="376" text-anchor="middle" font-size="14" fill="#566762">进入独立数据空间</text><text x="290" y="376" text-anchor="middle" font-size="14" fill="#566762">建立基本上下文</text><text x="454" y="376" text-anchor="middle" font-size="14" fill="#566762">先说最关心情况</text><text x="618" y="376" text-anchor="middle" font-size="14" fill="#566762">理解回答与证据</text><text x="782" y="376" text-anchor="middle" font-size="14" fill="#566762">记录状态和来源</text><text x="946" y="376" text-anchor="middle" font-size="14" fill="#566762">检查缺口与冲突</text><text x="1110" y="376" text-anchor="middle" font-size="14" fill="#566762">继续或结束</text></g>
<g id="loop"><rect x="244" y="470" width="792" height="82" fill="#EFEEE8"/><text x="640" y="505" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#155348">每次回答后重新判断</text><text x="640" y="533" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#566762">信息抽取 → 字段状态更新 → 完整度计算 → 选择下一问或生成档案</text></g><text x="1136" y="670" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#566762">06</text></svg>
