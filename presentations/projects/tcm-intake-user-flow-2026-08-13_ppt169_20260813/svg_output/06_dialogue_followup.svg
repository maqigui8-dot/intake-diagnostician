  <text x="177" y="200" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#2F8F4E">提问策略技能</text>

  <circle cx="108" cy="249" r="21" fill="#2F8F4E"/>
  <text x="108" y="256" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">1</text>
  <text x="145" y="255" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="700" fill="#21352A">读取当前回答</text>
  <line x1="108" y1="271" x2="108" y2="298" stroke="#DCE5DD" stroke-width="3"/>
  <circle cx="108" cy="321" r="21" fill="#2F8F4E"/>
  <text x="108" y="328" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">2</text>
  <text x="145" y="327" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="700" fill="#21352A">选择最高优先级缺口</text>
  <line x1="108" y1="343" x2="108" y2="370" stroke="#DCE5DD" stroke-width="3"/>
  <circle cx="108" cy="393" r="21" fill="#2F8F4E"/>
  <text x="108" y="400" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">3</text>
  <text x="145" y="399" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="700" fill="#21352A">生成一个清晰问题</text>
  <line x1="108" y1="415" x2="108" y2="442" stroke="#DCE5DD" stroke-width="3"/>
  <circle cx="108" cy="465" r="21" fill="#D6A74B"/>
  <text x="108" y="472" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">4</text>
  <text x="145" y="471" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="700" fill="#21352A">更新档案并再次判断</text>
  <text x="88" y="507" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#6C7A70">内部决策不直接展示给用户</text>

  <rect x="422" y="142" width="806" height="422" rx="22" fill="#F5F8F4" stroke="#DCE5DD" stroke-width="2"/>
  <rect x="434" y="154" width="782" height="374" rx="14" fill="#FFFFFF"/>
  <image x="434" y="154" width="782" height="374" href="../images/03_follow_up_chat.png" preserveAspectRatio="xMidYMid meet" clip-path="url(#chatShot)"/>
  <circle cx="450" cy="546" r="5" fill="#2F8F4E"/>
  <text x="464" y="552" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#6C7A70">真实页面：答案进入上下文，下一问在同一对话中继续</text>

  <rect x="64" y="590" width="1152" height="78" rx="16" fill="#FBF4DF" stroke="#DCE5DD" stroke-width="2"/>
  <text x="92" y="621" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700" fill="#1D5732">轮次控制</text>
  <text x="92" y="650" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#21352A">追问数量按病情动态生成，不固定为 5 问；通过完整度、重复检测、信息增益和最大轮次共同结束。</text>
  <text x="1204" y="695" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#A5B0A8">06 / 07</text>
