<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <clipPath id="chatShot"><rect x="434" y="154" width="782" height="374" rx="14"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="64" y="55" width="8" height="44" rx="4" fill="#2F8F4E"/>
  <text x="92" y="88" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700" fill="#21352A">阶段二：对话式补充追问</text>
  <text x="92" y="122" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#6C7A70">每次只问一个最有价值的问题，根据回答实时更新下一步</text>

  <rect x="64" y="154" width="338" height="374" rx="18" fill="#F5F8F4" stroke="#DCE5DD" stroke-width="2"/>
