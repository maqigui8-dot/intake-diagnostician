  </g>
    <text x="972" y="232" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="bold" fill="#24332B">看不快</text>
    <text font-size="19" font-family="Microsoft YaHei, Arial, sans-serif" fill="#68756D" x="920" y="292">医生需要在较短时间内识别</text><text font-size="19" font-family="Microsoft YaHei, Arial, sans-serif" fill="#68756D" x="920" y="326">信息缺口、回答冲突和需要</text><text font-size="19" font-family="Microsoft YaHei, Arial, sans-serif" fill="#68756D" x="920" y="360">优先确认的风险线索。</text><path fill="#C68A3A" d="M922,402 H1002 A2,2 0 0 1 1004,404 V404 A2,2 0 0 1 1002,406 H922 A2,2 0 0 1 920,404 V404 A2,2 0 0 1 922,402 Z" />
  </g>
