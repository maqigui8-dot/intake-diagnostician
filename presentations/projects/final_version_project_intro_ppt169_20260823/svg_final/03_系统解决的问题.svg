    <path fill="#FFFFFF" stroke="#D7E2D8" stroke-width="2" d="M72,178 H388 A8,8 0 0 1 396,186 V446 A8,8 0 0 1 388,454 H72 A8,8 0 0 1 64,446 V186 A8,8 0 0 1 72,178 Z" />
