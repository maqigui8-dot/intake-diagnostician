  </g>
    <text x="148" y="232" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="bold" fill="#24332B">说不清</text>
    <text font-size="19" font-family="Microsoft YaHei, Arial, sans-serif" fill="#68756D" x="96" y="292">患者的症状、持续时间、</text><text font-size="19" font-family="Microsoft YaHei, Arial, sans-serif" fill="#68756D" x="96" y="326">诱因和既往情况，常常混在</text><text font-size="19" font-family="Microsoft YaHei, Arial, sans-serif" fill="#68756D" x="96" y="360">一段自然语言里。</text><path fill="#C68A3A" d="M98,402 H178 A2,2 0 0 1 180,404 V404 A2,2 0 0 1 178,406 H98 A2,2 0 0 1 96,404 V404 A2,2 0 0 1 98,402 Z" />
  </g>
