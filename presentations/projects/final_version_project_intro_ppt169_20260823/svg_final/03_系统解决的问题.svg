  </g>
    <text x="560" y="232" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="bold" fill="#24332B">问不全</text>
    <text font-size="19" font-family="Microsoft YaHei, Arial, sans-serif" fill="#68756D" x="508" y="292">首次问诊时间有限，需要同时</text><text font-size="19" font-family="Microsoft YaHei, Arial, sans-serif" fill="#68756D" x="508" y="326">覆盖中医症状、用药安全、</text><text font-size="19" font-family="Microsoft YaHei, Arial, sans-serif" fill="#68756D" x="508" y="360">既往史和代谢风险。</text><path fill="#C68A3A" d="M510,402 H590 A2,2 0 0 1 592,404 V404 A2,2 0 0 1 590,406 H510 A2,2 0 0 1 508,404 V404 A2,2 0 0 1 510,402 Z" />
  </g>
