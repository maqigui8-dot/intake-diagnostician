    <text x="180" y="546" font-family="KaiTi, Georgia, serif" font-size="27" font-weight="bold" fill="#FFFFFF">系统输出</text>
    <text x="180" y="582" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" fill="#F1F6EF">结构化、可追溯、可继续确认的诊前档案与检查准备建议</text>
  </g>
