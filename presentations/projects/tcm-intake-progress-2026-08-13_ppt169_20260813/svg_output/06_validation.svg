<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#174B39"/>

  <g id="page-header">
    <rect x="52" y="46" width="114" height="30" rx="15" fill="#DDEEE6"/>
    <text x="109" y="67" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#174B39">验证结果</text>
    <text x="52" y="124" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">修复结果与验证</text>
    <text x="52" y="158" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#DDEEE6">无限追问已从“依赖模型停止”改为“流程级保证结束”</text>
    <use data-icon="tabler-outline/clipboard-check" x="1178" y="64" width="42" height="42" fill="none" stroke="#DDEEE6" stroke-width="2"/>
  </g>

  <g id="metric-12">
    <rect x="52" y="202" width="276" height="260" rx="18" fill="#FFFFFF"/>
    <text x="82" y="250" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#237A57">允许正常高轮次</text>
    <text x="82" y="330" font-family="Microsoft YaHei, Arial, sans-serif" font-size="56" font-weight="700" fill="#237A57">12</text>
    <text x="82" y="370" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E2A25">第 12 个回答正常保存</text>
    <text x="82" y="408" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#617068">不再固定限制为 5 轮</text>
    <rect x="82" y="428" width="92" height="22" rx="11" fill="#DDEEE6"/>
    <text x="128" y="444" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#174B39">验证通过</text>
  </g>

  <g id="metric-13">
    <rect x="352" y="202" width="276" height="260" rx="18" fill="#FFFFFF"/>
    <text x="382" y="250" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#E45B4B">安全边界生效</text>
    <text x="382" y="330" font-family="Microsoft YaHei, Arial, sans-serif" font-size="56" font-weight="700" fill="#E45B4B">13</text>
    <text x="382" y="370" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E2A25">第 13 次提交直接拒绝</text>
    <text x="382" y="408" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#617068">不会再继续到 30 轮</text>
    <rect x="382" y="428" width="92" height="22" rx="11" fill="#FBE9E6"/>
    <text x="428" y="444" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#E45B4B">返回 400</text>
  </g>

  <g id="metric-backend">
    <rect x="652" y="202" width="276" height="260" rx="18" fill="#FFFFFF"/>
    <text x="682" y="250" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#D6A83B">后端验证</text>
    <text x="682" y="330" font-family="Microsoft YaHei, Arial, sans-serif" font-size="56" font-weight="700" fill="#D6A83B">31</text>
    <text x="682" y="370" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E2A25">后端测试全部通过</text>
    <text x="682" y="408" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#617068">策略、接口、Skill 分析</text>
    <rect x="682" y="428" width="92" height="22" rx="11" fill="#FBF4DD"/>
    <text x="728" y="444" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#174B39">31 / 31</text>
  </g>

  <g id="metric-frontend">
    <rect x="952" y="202" width="276" height="260" rx="18" fill="#FFFFFF"/>
    <text x="982" y="250" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#237A57">前端验证</text>
    <text x="982" y="330" font-family="Microsoft YaHei, Arial, sans-serif" font-size="56" font-weight="700" fill="#237A57">15</text>
    <text x="982" y="370" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E2A25">前端测试全部通过</text>
    <text x="982" y="408" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#617068">阶段判断与患者可见内容</text>
    <rect x="982" y="428" width="92" height="22" rx="11" fill="#DDEEE6"/>
    <text x="1028" y="444" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#174B39">15 / 15</text>
  </g>

  <g id="final-status">
    <rect x="52" y="500" width="1176" height="126" rx="18" fill="#DDEEE6"/>
    <circle cx="98" cy="545" r="24" fill="#237A57"/>
    <use data-icon="tabler-outline/checks" x="83" y="530" width="30" height="30" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="138" y="550" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="700" fill="#174B39">当前状态：对话式追问可以继续，也一定能够结束</text>
    <text x="138" y="590" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#617068">重复缺口被拦截 · 选问项不再阻塞 · 生产构建通过 · 页面无控制台错误</text>
  </g>

  <g id="footer">
    <text x="52" y="684" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#DDEEE6">中医诊前问诊系统 · 今日修改验证完成</text>
    <text x="1228" y="684" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#DDEEE6">06 / 06</text>
  </g>
</svg>
