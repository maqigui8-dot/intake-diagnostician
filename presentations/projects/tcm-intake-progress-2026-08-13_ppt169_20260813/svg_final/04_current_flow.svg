    <text x="108" y="198" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#174B39">基础十题</text>
    <text x="72" y="238" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#617068">采集主诉、持续时间、</text>
    <text x="72" y="264" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#617068">寒热、二便等基础资料</text>
  </g>

