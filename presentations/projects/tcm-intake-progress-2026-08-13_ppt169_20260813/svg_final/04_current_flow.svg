    <text x="78" y="566" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#174B39">核心变化：追问是“判断 → 提问 → 回答 → 再判断”的闭环</text>
    <text x="78" y="603" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#617068">轮数由信息决定，但流程不再无限延伸。</text>
