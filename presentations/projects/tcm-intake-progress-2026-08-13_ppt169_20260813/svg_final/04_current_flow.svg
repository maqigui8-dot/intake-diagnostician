    <path d="M20 12v3a3 3 0 0 1 -3 3h-13m3 3l-3 -3l3 -3" />
  </g>
    <text x="350" y="397" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#174B39">保存并重分析</text>
    <text x="310" y="431" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#617068">保存问题和回答</text>
    <text x="310" y="454" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#617068">记录 key 与类型</text>
    <text x="310" y="477" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#617068">返回完整度判断</text>
  </g>

