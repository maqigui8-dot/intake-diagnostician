    <text x="625" y="617" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#174B39">两个 Skill</text>
    <path fill="#F3F7F5" stroke="#D9E4DE" d="M747,590 H905 A21,21 0 0 1 926,611 V611 A21,21 0 0 1 905,632 H747 A21,21 0 0 1 726,611 V611 A21,21 0 0 1 747,590 Z" />
    <text x="826" y="617" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#174B39">智能分析协议</text>
    <path fill="#F3F7F5" stroke="#D9E4DE" d="M963,590 H1117 A21,21 0 0 1 1138,611 V611 A21,21 0 0 1 1117,632 H963 A21,21 0 0 1 942,611 V611 A21,21 0 0 1 963,590 Z" />
    <text x="1040" y="617" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#174B39">自动化测试</text>
  </g>

  <g id="footer">
    <text x="52" y="690" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#A7B3AD">中医诊前问诊系统 · 今日改造对比</text>
    <text x="1228" y="690" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#617068">02 / 06</text>
