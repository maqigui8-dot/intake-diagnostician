    <path fill="#F3F7F5" stroke="#D9E4DE" d="M189,590 H317 A21,21 0 0 1 338,611 V611 A21,21 0 0 1 317,632 H189 A21,21 0 0 1 168,611 V611 A21,21 0 0 1 189,590 Z" />
    <text x="253" y="617" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#174B39">前端交互</text>
