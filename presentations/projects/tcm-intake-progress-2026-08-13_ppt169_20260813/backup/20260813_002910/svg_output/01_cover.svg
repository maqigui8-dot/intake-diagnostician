<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#F3F7F5"/>
  <rect x="0" y="0" width="712" height="720" fill="#FFFFFF"/>

  <g id="cover-title">
    <rect x="58" y="64" width="126" height="34" rx="17" fill="#DDEEE6"/>
    <text x="121" y="87" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#237A57">阶段进展汇报</text>
    <text x="58" y="190" font-family="Microsoft YaHei, Arial, sans-serif" font-size="64" font-weight="700" fill="#174B39">
      <tspan x="58" dy="0">中医诊前</tspan>
      <tspan x="58" dy="82">问诊系统</tspan>
    </text>
    <rect x="58" y="312" width="72" height="6" rx="3" fill="#E45B4B"/>
    <text x="58" y="370" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="600" fill="#1E2A25">今日改造对比与当前完整流程</text>
    <text x="58" y="416" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#617068">从单张问题卡，升级为可收敛的对话式问诊闭环</text>
    <text x="58" y="650" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#617068">2026.08.13</text>
  </g>

  <g id="transformation-visual">
    <rect x="756" y="74" width="468" height="572" rx="26" fill="#174B39"/>
    <text x="796" y="122" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#DDEEE6">TODAY'S CHANGE</text>

    <g id="old-card">
      <rect x="794" y="164" width="258" height="144" rx="14" fill="#FFFFFF"/>
      <circle cx="828" cy="198" r="19" fill="#FBE9E6"/>
      <use data-icon="tabler-outline/alert-circle" x="816" y="186" width="24" height="24" fill="none" stroke="#E45B4B" stroke-width="2"/>
      <text x="858" y="202" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E2A25">单张问题卡</text>
      <text x="818" y="244" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#617068">只突出当前问题</text>
      <text x="818" y="274" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#617068">上下文连续性较弱</text>
    </g>

    <g id="change-arrow">
      <line x1="922" y1="328" x2="922" y2="380" stroke="#D6A83B" stroke-width="4" stroke-linecap="round"/>
      <polygon points="922,395 912,377 932,377" fill="#D6A83B"/>
      <rect x="868" y="340" width="108" height="30" rx="15" fill="#FBF4DD"/>
      <text x="922" y="361" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#174B39">交互升级</text>
    </g>

    <g id="new-chat">
      <rect x="846" y="408" width="332" height="190" rx="18" fill="#DDEEE6"/>
      <circle cx="884" cy="446" r="20" fill="#237A57"/>
      <use data-icon="tabler-outline/message-circle" x="872" y="434" width="24" height="24" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <rect x="918" y="428" width="222" height="50" rx="14" fill="#FFFFFF"/>
      <text x="936" y="459" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1E2A25">最近什么时候更明显？</text>
      <rect x="968" y="492" width="172" height="44" rx="14" fill="#237A57"/>
      <text x="1054" y="520" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#FFFFFF">通常是饭后</text>
      <rect x="918" y="550" width="188" height="30" rx="15" fill="#FFFFFF"/>
      <circle cx="940" cy="565" r="4" fill="#237A57"/>
      <circle cx="956" cy="565" r="4" fill="#237A57"/>
      <circle cx="972" cy="565" r="4" fill="#237A57"/>
      <text x="1100" y="624" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#DDEEE6">对话式 · 可追踪 · 能结束</text>
    </g>
  </g>

  <g id="footer">
    <text x="1224" y="686" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#617068">01 / 06</text>
  </g>
</svg>
