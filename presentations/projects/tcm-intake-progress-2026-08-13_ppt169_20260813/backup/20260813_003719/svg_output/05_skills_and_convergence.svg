<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#237A57"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="page-header">
    <text x="52" y="68" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#237A57">SKILL RESPONSIBILITIES</text>
    <text x="52" y="112" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700" fill="#174B39">两个 Skill 与追问收敛</text>
    <text x="1228" y="104" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#617068">判断、表达、策略三层分工</text>
  </g>

  <g id="skill-checklist">
    <rect x="52" y="148" width="510" height="250" rx="18" fill="#DDEEE6"/>
    <circle cx="98" cy="194" r="25" fill="#237A57"/>
    <use data-icon="tabler-outline/list-check" x="83" y="179" width="30" height="30" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="138" y="188" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#237A57">SKILL 01</text>
    <text x="138" y="220" font-family="Consolas, Courier New, monospace" font-size="20" font-weight="700" fill="#174B39">tcm-intake-checklist</text>
    <line x1="82" y1="246" x2="532" y2="246" stroke="#237A57" stroke-width="1"/>
    <text x="82" y="282" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="700" fill="#174B39">决定“问什么”</text>
    <circle cx="89" cy="320" r="5" fill="#237A57"/>
    <text x="108" y="327" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#1E2A25">按十问歌、主诉和老中医经验检查资料</text>
    <circle cx="89" cy="358" r="5" fill="#237A57"/>
    <text x="108" y="365" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#1E2A25">区分关键必问项与建议选问项</text>
  </g>

  <g id="skill-handoff">
    <line x1="580" y1="273" x2="684" y2="273" stroke="#237A57" stroke-width="3" marker-end="url(#arrow-green)"/>
    <rect x="589" y="235" width="86" height="30" rx="15" fill="#FBF4DD"/>
    <text x="632" y="256" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#174B39">最重要缺口</text>
  </g>

  <g id="skill-questioning">
    <rect x="700" y="148" width="528" height="250" rx="18" fill="#F3F7F5" stroke="#D9E4DE"/>
    <circle cx="746" cy="194" r="25" fill="#174B39"/>
    <use data-icon="tabler-outline/brain" x="731" y="179" width="30" height="30" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="786" y="188" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="700" fill="#237A57">SKILL 02</text>
    <text x="786" y="220" font-family="Consolas, Courier New, monospace" font-size="20" font-weight="700" fill="#174B39">tcm-questioning-guide</text>
    <line x1="730" y1="246" x2="1198" y2="246" stroke="#D9E4DE" stroke-width="1"/>
    <text x="730" y="282" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="700" fill="#174B39">决定“怎么问”</text>
    <circle cx="737" cy="320" r="5" fill="#237A57"/>
    <text x="756" y="327" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#1E2A25">把缺口转成自然、温和、单一问点的问题</text>
    <circle cx="737" cy="358" r="5" fill="#237A57"/>
    <text x="756" y="365" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#1E2A25">为同一信息缺口生成稳定 key</text>
  </g>

  <g id="analysis-output">
    <rect x="204" y="430" width="872" height="58" rx="16" fill="#174B39"/>
    <text x="230" y="466" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#DDEEE6">智能分析输出</text>
    <rect x="382" y="443" width="200" height="32" rx="16" fill="#FFFFFF"/>
    <text x="482" y="465" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="14" fill="#174B39">follow_up_questions</text>
    <rect x="598" y="443" width="174" height="32" rx="16" fill="#FFFFFF"/>
    <text x="685" y="465" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="14" fill="#174B39">follow_up_key</text>
    <rect x="788" y="443" width="170" height="32" rx="16" fill="#FFFFFF"/>
    <text x="873" y="465" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="14" fill="#174B39">follow_up_kind</text>
  </g>

  <g id="policy-layer">
    <rect x="52" y="514" width="1176" height="126" rx="18" fill="#F3F7F5"/>
    <use data-icon="tabler-outline/shield-check" x="76" y="538" width="32" height="32" fill="none" stroke="#237A57" stroke-width="2"/>
    <text x="124" y="561" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#174B39">策略层保证追问一定收敛</text>

    <rect x="76" y="584" width="258" height="38" rx="19" fill="#DDEEE6"/>
    <text x="205" y="609" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#174B39">只有关键必问项可继续</text>
    <rect x="352" y="584" width="250" height="38" rx="19" fill="#DDEEE6"/>
    <text x="477" y="609" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#174B39">选问项不能阻止结束</text>
    <rect x="620" y="584" width="250" height="38" rx="19" fill="#FBF4DD"/>
    <text x="745" y="609" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#174B39">已询问 key 不得重复</text>
    <rect x="888" y="584" width="316" height="38" rx="19" fill="#FBE9E6"/>
    <text x="1046" y="609" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#E45B4B">达到 12 轮时后台安全结束</text>
  </g>

  <g id="footer">
    <text x="52" y="690" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#A7B3AD">中医诊前问诊系统 · Skill 分工与策略层</text>
    <text x="1228" y="690" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#617068">05 / 06</text>
  </g>
</svg>
