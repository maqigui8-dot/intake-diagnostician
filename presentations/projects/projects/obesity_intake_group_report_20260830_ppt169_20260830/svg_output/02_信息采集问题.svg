<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F7F5EF"/>
  <text x="64" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#C76B3C">01 · 项目背景</text>
  <text x="64" y="126" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700" fill="#174C43">成人肥胖诊前问诊面临的信息采集问题</text>
  <line x1="64" y1="148" x2="1216" y2="148" stroke="#CDD8D2" stroke-width="2"/>
  <text x="72" y="204" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#62716B">现实链条</text>
  <line x1="142" y1="286" x2="142" y2="530" stroke="#6E9184" stroke-width="4"/>
  <circle cx="142" cy="286" r="12" fill="#174C43"/>
  <circle cx="142" cy="408" r="12" fill="#174C43"/>
  <circle cx="142" cy="530" r="12" fill="#C76B3C"/>
  <text x="184" y="278" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#24332E">患者表达零散</text>
  <text x="184" y="312" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#62716B">症状、病程和时间关系混在自然语言中</text>
  <text x="184" y="400" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#24332E">固定问卷缺乏针对性</text>
  <text x="184" y="434" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#62716B">不能根据已有回答自动减少重复问题</text>
  <text x="184" y="522" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#24332E">采集范围难以平衡</text>
  <text x="184" y="556" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#62716B">问得过少可能遗漏，问得过多增加负担</text>
  <rect x="702" y="212" width="466" height="370" fill="#FFFFFF" stroke="#CDD8D2" stroke-width="2"/>
  <rect x="702" y="212" width="12" height="370" fill="#174C43"/>
  <use data-icon="tabler-outline/search" x="754" y="258" width="42" height="42" fill="#174C43" stroke-width="2"/>
  <text x="754" y="340" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#C76B3C">核心研究问题</text>
  <text x="754" y="390" font-family="Microsoft YaHei, Arial, sans-serif" font-size="27" font-weight="700" fill="#174C43">系统如何判断</text>
  <text x="754" y="432" font-family="Microsoft YaHei, Arial, sans-serif" font-size="27" font-weight="700" fill="#174C43">还缺什么、是否追问，</text>
  <text x="754" y="474" font-family="Microsoft YaHei, Arial, sans-serif" font-size="27" font-weight="700" fill="#174C43">以及何时结束？</text>
  <text x="754" y="532" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#62716B">判断对象不是“问了多少题”，</text>
  <text x="754" y="560" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#62716B">而是“核心信息是否已经可用”。</text>
  <text x="1216" y="684" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#62716B">02</text>
</svg>
