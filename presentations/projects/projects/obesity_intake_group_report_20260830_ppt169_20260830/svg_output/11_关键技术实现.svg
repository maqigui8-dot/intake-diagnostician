  <text x="64" y="126" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700" fill="#174C43">关键技术问题与当前实现</text>
  <line x1="64" y1="148" x2="1216" y2="148" stroke="#CDD8D2" stroke-width="2"/>
  <rect x="64" y="186" width="1152" height="54" fill="#174C43"/>
  <line x1="380" y1="186" x2="380" y2="574" stroke="#CDD8D2"/><line x1="922" y1="186" x2="922" y2="574" stroke="#CDD8D2"/>
  <g font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700" fill="#F7F5EF">
    <text x="88" y="220">关键技术问题</text><text x="406" y="220">当前处理方式</text><text x="948" y="220">当前状态</text>
  </g>
  <g stroke="#CDD8D2"><line x1="64" y1="308" x2="1216" y2="308"/><line x1="64" y1="376" x2="1216" y2="376"/><line x1="64" y1="444" x2="1216" y2="444"/><line x1="64" y1="512" x2="1216" y2="512"/><line x1="64" y1="574" x2="1216" y2="574"/></g>
  <g font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#24332E">
    <text x="88" y="274">一句话包含多个信息点</text><text x="406" y="264">一次提取多个字段，</text><text x="406" y="289">并保留患者原始证据</text><text x="948" y="276" fill="#174C43">已实现，待病例验证</text>
