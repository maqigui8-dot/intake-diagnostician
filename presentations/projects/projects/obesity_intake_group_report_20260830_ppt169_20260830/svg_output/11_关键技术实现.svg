  </g>
  <rect x="160" y="610" width="960" height="50" fill="#E8EFEA"/>
  <text x="640" y="641" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#174C43">工程实现 ≠ 临床验证：下一阶段需用标准病例与专家评价验证实际效果</text>
  <text x="1216" y="684" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#62716B">11</text>
