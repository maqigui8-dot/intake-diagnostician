<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F7F5EF"/>
  <text x="64" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700" fill="#C76B3C">06 · 核心机制</text>
  <text x="64" y="126" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700" fill="#174C43">信息完整度如何判断？</text>
  <line x1="64" y1="148" x2="1216" y2="148" stroke="#CDD8D2" stroke-width="2"/>
  <text x="76" y="196" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#62716B">四层核心信息</text>
  <rect x="74" y="220" width="670" height="84" fill="#174C43"/>
  <rect x="104" y="318" width="640" height="84" fill="#6E9184"/>
  <rect x="134" y="416" width="610" height="84" fill="#DCEAE4"/>
  <rect x="164" y="514" width="580" height="84" fill="#F7E7DE"/>
  <!-- icon: tabler-outline/forms -->
  <g transform="translate(96, 242) scale(1.58333)" fill="none" stroke="#F7F5EF" stroke-width="2">
    <path d="M12 3a3 3 0 0 0 -3 3v12a3 3 0 0 0 3 3" />
    <path d="M6 3a3 3 0 0 1 3 3v12a3 3 0 0 1 -3 3" />
