<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7FAF7"/>
  <g id="chrome">
    <text x="56" y="57" fill="#2F7D4A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700">INTAKE DIAGNOSTICIAN · WEEKLY REPORT</text>
    <text x="1224" y="680" fill="#8A978E" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" text-anchor="end">06</text>
  </g>
  <g id="title">
    <text x="56" y="105" fill="#1F2A24" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700">前端改造亮点</text>
    <text x="56" y="137" fill="#5F6F64" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20">用户始终知道“现在在哪、还差什么”</text>
  </g>
  <g id="product-shot">
    <rect x="56" y="166" width="486" height="500" rx="8" fill="#FFFFFF" stroke="#D8E4DA" stroke-width="1.5"/>
    <image x="66" y="176" width="466" height="480" xlink:href="../images/current-ui.png" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g id="hotspots">
    <circle cx="120" cy="312" r="18" fill="#2F7D4A"/>
    <text x="120" y="319" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">1</text>
    <circle cx="309" cy="350" r="18" fill="#2F7D4A"/>
    <text x="309" y="357" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">2</text>
    <circle cx="478" cy="296" r="18" fill="#2F7D4A"/>
    <text x="478" y="303" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">3</text>
    <circle cx="427" cy="548" r="18" fill="#D9A441"/>
    <text x="427" y="555" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">4</text>
  </g>
  <g id="legend">
    <rect x="578" y="166" width="646" height="110" rx="8" fill="#FFFFFF" stroke="#D8E4DA" stroke-width="1.5"/>
    <circle cx="618" cy="211" r="20" fill="#2F7D4A"/>
    <text x="618" y="218" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">1</text>
    <text x="654" y="205" fill="#1F2A24" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700">四阶段导航</text>
    <text x="654" y="238" fill="#5F6F64" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17">流程位置、已完成状态和下一步一目了然</text>

    <rect x="578" y="292" width="646" height="110" rx="8" fill="#FFFFFF" stroke="#D8E4DA" stroke-width="1.5"/>
    <circle cx="618" cy="337" r="20" fill="#2F7D4A"/>
    <text x="618" y="344" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">2</text>
    <text x="654" y="331" fill="#1F2A24" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700">题目与选项聚焦</text>
    <text x="654" y="364" fill="#5F6F64" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17">一次只处理一个判断，降低填写负担</text>

    <rect x="578" y="418" width="646" height="110" rx="8" fill="#FFFFFF" stroke="#D8E4DA" stroke-width="1.5"/>
    <circle cx="618" cy="463" r="20" fill="#2F7D4A"/>
    <text x="618" y="470" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">3</text>
    <text x="654" y="457" fill="#1F2A24" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700">进度与答案同步</text>
    <text x="654" y="490" fill="#5F6F64" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17">右侧持续展示题目状态和已收集信息</text>

    <rect x="578" y="544" width="646" height="110" rx="8" fill="#EEF6EF" stroke="#65B66C" stroke-width="1.5"/>
    <circle cx="618" cy="589" r="20" fill="#D9A441"/>
    <text x="618" y="596" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">4</text>
    <text x="654" y="583" fill="#1F2A24" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700">摘要与响应式适配</text>
    <text x="654" y="616" fill="#5F6F64" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17">桌面端完整展示，窄屏仍保留核心操作路径</text>
