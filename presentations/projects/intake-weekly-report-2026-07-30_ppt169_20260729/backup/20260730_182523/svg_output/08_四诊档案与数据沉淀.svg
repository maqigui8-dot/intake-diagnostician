<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#F7FAF7"/>
  <g id="chrome">
    <text x="56" y="57" fill="#2F7D4A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700">INTAKE DIAGNOSTICIAN · WEEKLY REPORT</text>
    <text x="1224" y="680" fill="#8A978E" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" text-anchor="end">08</text>
  </g>
  <g id="title">
    <text x="56" y="105" fill="#1F2A24" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700">四诊档案与数据沉淀</text>
    <text x="56" y="137" fill="#5F6F64" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20">从“答完即结束”升级为可检索、可回看的诊疗资料</text>
  </g>
  <g id="pipeline">
    <line x1="198" y1="326" x2="1082" y2="326" stroke="#D8E4DA" stroke-width="8"/>
    <line x1="198" y1="326" x2="1082" y2="326" stroke="#65B66C" stroke-width="4"/>

    <circle cx="198" cy="326" r="46" fill="#2F7D4A"/>
    <text x="198" y="337" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">1</text>
    <rect x="74" y="390" width="248" height="138" rx="8" fill="#FFFFFF" stroke="#D8E4DA" stroke-width="1.5"/>
    <text x="198" y="429" fill="#1F2A24" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle">用户回答</text>
    <text x="198" y="465" fill="#5F6F64" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" text-anchor="middle">症状、时长、诱因</text>
    <text x="198" y="494" fill="#5F6F64" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" text-anchor="middle">伴随情况与补充描述</text>

    <circle cx="492" cy="326" r="46" fill="#65B66C"/>
    <text x="492" y="337" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">2</text>
    <rect x="368" y="390" width="248" height="138" rx="8" fill="#FFFFFF" stroke="#D8E4DA" stroke-width="1.5"/>
    <text x="492" y="429" fill="#1F2A24" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle">会话与摘要</text>
    <text x="492" y="465" fill="#5F6F64" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" text-anchor="middle">保留题目顺序和答案</text>
    <text x="492" y="494" fill="#5F6F64" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" text-anchor="middle">同步生成结构化摘要</text>

    <circle cx="786" cy="326" r="46" fill="#D9A441"/>
    <text x="786" y="337" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">3</text>
    <rect x="662" y="390" width="248" height="138" rx="8" fill="#FFFFFF" stroke="#D8E4DA" stroke-width="1.5"/>
    <text x="786" y="429" fill="#1F2A24" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle">四诊档案</text>
    <text x="786" y="465" fill="#5F6F64" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" text-anchor="middle">自动整理 Markdown</text>
    <text x="786" y="494" fill="#5F6F64" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" text-anchor="middle">形成可阅读的问诊记录</text>

    <circle cx="1082" cy="326" r="46" fill="#2F7D4A"/>
    <text x="1082" y="337" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">4</text>
    <rect x="958" y="390" width="248" height="138" rx="8" fill="#FFFFFF" stroke="#D8E4DA" stroke-width="1.5"/>
    <text x="1082" y="429" fill="#1F2A24" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle">JSON 记录</text>
    <text x="1082" y="465" fill="#5F6F64" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" text-anchor="middle">保存 structured_answers</text>
    <text x="1082" y="494" fill="#5F6F64" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" text-anchor="middle">支持后续统计与扩展</text>
  </g>
  <g id="value-strip">
    <rect x="56" y="570" width="1168" height="70" rx="8" fill="#EEF6EF" stroke="#D8E4DA" stroke-width="1.5"/>
    <use data-icon="tabler-outline/database-heart" x="86" y="590" width="30" height="30" fill="#2F7D4A" stroke-width="2"/>
    <text x="134" y="615" fill="#1F2A24" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="700">数据价值</text>
    <text x="302" y="615" fill="#2F7D4A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700">可检索</text>
    <circle cx="410" cy="607" r="4" fill="#D9A441"/>
    <text x="452" y="615" fill="#2F7D4A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700">可回看</text>
    <circle cx="560" cy="607" r="4" fill="#D9A441"/>
    <text x="602" y="615" fill="#2F7D4A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700">可扩展</text>
    <text x="760" y="615" fill="#5F6F64" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17">为档案管理、统计分析和模型优化提供基础</text>
  </g>
</svg>
