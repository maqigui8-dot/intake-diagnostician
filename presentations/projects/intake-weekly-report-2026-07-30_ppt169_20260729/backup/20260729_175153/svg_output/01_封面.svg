<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#F7FAF7"/>
    <circle cx="1110" cy="104" r="154" fill="#EEF6EF"/>
    <circle cx="1170" cy="40" r="48" fill="#D8E4DA"/>
  </g>
  <g id="brand">
    <circle cx="76" cy="62" r="24" fill="#2F7D4A"/>
    <use data-icon="tabler-outline/report-medical" x="62" y="48" width="28" height="28" fill="#FFFFFF" stroke-width="2"/>
    <text x="114" y="70" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#2F7D4A">中医智能助手</text>
  </g>
  <g id="cover-title">
    <text x="76" y="220" font-family="Microsoft YaHei, Arial, sans-serif" font-size="64" font-weight="700" fill="#1F2A24">
      <tspan x="76" dy="0">AI 老中医</tspan>
      <tspan x="76" dy="82">问诊系统</tspan>
    </text>
    <rect x="76" y="335" width="94" height="6" rx="3" fill="#65B66C"/>
    <text x="76" y="390" font-family="Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="600" fill="#2F7D4A">本周工作汇报</text>
    <text x="76" y="432" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#5F6F64">结构化问诊产品升级</text>
  </g>
  <g id="upgrade-route">
    <path d="M 660 430 C 760 300 900 300 1030 210" fill="none" stroke="#D8E4DA" stroke-width="10" stroke-linecap="round"/>
    <path d="M 660 430 C 760 300 900 300 1030 210" fill="none" stroke="#65B66C" stroke-width="3" stroke-dasharray="8,4" stroke-linecap="round"/>
    <g id="step-chat">
      <circle cx="660" cy="430" r="46" fill="#FFFFFF" stroke="#D8E4DA" stroke-width="2"/>
      <text x="660" y="438" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#5F6F64">聊天</text>
    </g>
    <g id="step-guide">
      <circle cx="770" cy="330" r="46" fill="#FFFFFF" stroke="#65B66C" stroke-width="3"/>
      <text x="770" y="338" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#2F7D4A">引导</text>
    </g>
    <g id="step-structure">
      <circle cx="900" cy="286" r="46" fill="#EEF6EF" stroke="#65B66C" stroke-width="3"/>
      <text x="900" y="294" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#2F7D4A">结构化</text>
    </g>
    <g id="step-record">
      <circle cx="1030" cy="210" r="56" fill="#2F7D4A"/>
      <use data-icon="tabler-outline/database-heart" x="1006" y="186" width="48" height="48" fill="#FFFFFF" stroke-width="2"/>
      <text x="1030" y="292" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#2F7D4A">四诊档案</text>
    </g>
  </g>
  <g id="cover-footer">
    <line x1="76" y1="638" x2="1204" y2="638" stroke="#D8E4DA" stroke-width="1"/>
    <text x="76" y="674" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#8A978E">2026.07.30</text>
    <text x="1204" y="674" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#8A978E">从聊天 Demo 到结构化问诊产品</text>
  </g>
</svg>
