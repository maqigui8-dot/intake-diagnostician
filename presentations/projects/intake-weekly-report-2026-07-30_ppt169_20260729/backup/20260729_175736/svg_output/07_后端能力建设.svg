<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F7FAF7"/>
  <g id="chrome">
    <text x="56" y="57" fill="#2F7D4A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700">INTAKE DIAGNOSTICIAN · WEEKLY REPORT</text>
    <text x="1224" y="680" fill="#8A978E" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" text-anchor="end">07</text>
  </g>
  <g id="title">
    <text x="56" y="105" fill="#1F2A24" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700">后端能力建设</text>
    <text x="56" y="137" fill="#5F6F64" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20">把一次问答组织成可维护、可扩展的完整服务</text>
  </g>
  <g id="architecture">
    <rect x="56" y="170" width="754" height="104" rx="8" fill="#FFFFFF" stroke="#D8E4DA" stroke-width="1.5"/>
    <rect x="56" y="170" width="12" height="104" rx="6" fill="#2F7D4A"/>
    <text x="88" y="206" fill="#2F7D4A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700">展示层</text>
    <text x="88" y="242" fill="#1F2A24" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21">Vue 页面 · 题目选择 · 进度同步 · 结果呈现</text>

    <rect x="76" y="288" width="734" height="104" rx="8" fill="#EEF6EF" stroke="#D8E4DA" stroke-width="1.5"/>
    <rect x="76" y="288" width="12" height="104" rx="6" fill="#65B66C"/>
    <text x="108" y="324" fill="#2F7D4A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700">流程层</text>
    <text x="108" y="360" fill="#1F2A24" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21">会话状态 · 答案更新 · 前后回退 · 问诊完成</text>

    <rect x="96" y="406" width="714" height="104" rx="8" fill="#FFFFFF" stroke="#D8E4DA" stroke-width="1.5"/>
    <rect x="96" y="406" width="12" height="104" rx="6" fill="#D9A441"/>
    <text x="128" y="442" fill="#2F7D4A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700">智能层</text>
    <text x="128" y="478" fill="#1F2A24" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21">Qwen / Ollama · 答案解释 · 智能追问 · 档案整理</text>

    <rect x="116" y="524" width="694" height="104" rx="8" fill="#EEF6EF" stroke="#D8E4DA" stroke-width="1.5"/>
    <rect x="116" y="524" width="12" height="104" rx="6" fill="#2F7D4A"/>
    <text x="148" y="560" fill="#2F7D4A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700">数据层</text>
    <text x="148" y="596" fill="#1F2A24" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21">结构化答案 · Markdown 档案 · JSON 记录</text>
  </g>
  <g id="api-panel">
    <rect x="846" y="170" width="378" height="458" rx="8" fill="#FFFFFF" stroke="#D8E4DA" stroke-width="1.5"/>
    <use data-icon="tabler-outline/server-cog" x="878" y="198" width="30" height="30" fill="#2F7D4A" stroke-width="2"/>
    <text x="922" y="221" fill="#1F2A24" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700">核心接口</text>

    <rect x="878" y="258" width="314" height="64" rx="8" fill="#EEF6EF"/>
    <text x="898" y="285" fill="#2F7D4A" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="700">GET</text>
    <text x="898" y="307" fill="#1F2A24" font-family="Consolas, Courier New, monospace" font-size="16">/state</text>
    <text x="1070" y="297" fill="#5F6F64" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16">获取状态</text>

    <rect x="878" y="338" width="314" height="64" rx="8" fill="#EEF6EF"/>
    <text x="898" y="365" fill="#2F7D4A" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="700">POST</text>
    <text x="898" y="387" fill="#1F2A24" font-family="Consolas, Courier New, monospace" font-size="16">/answer</text>
    <text x="1070" y="377" fill="#5F6F64" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16">提交答案</text>

    <rect x="878" y="418" width="314" height="64" rx="8" fill="#EEF6EF"/>
    <text x="898" y="445" fill="#2F7D4A" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="700">POST</text>
    <text x="898" y="467" fill="#1F2A24" font-family="Consolas, Courier New, monospace" font-size="16">/move</text>
    <text x="1070" y="457" fill="#5F6F64" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16">切换题目</text>

    <rect x="878" y="498" width="314" height="64" rx="8" fill="#EEF6EF"/>
    <text x="898" y="525" fill="#2F7D4A" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="700">POST</text>
    <text x="898" y="547" fill="#1F2A24" font-family="Consolas, Courier New, monospace" font-size="16">/complete</text>
    <text x="1070" y="537" fill="#5F6F64" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16">生成档案</text>

    <text x="878" y="598" fill="#5F6F64" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16">前后端职责清晰，后续可替换模型或存储方案</text>
  </g>
</svg>
