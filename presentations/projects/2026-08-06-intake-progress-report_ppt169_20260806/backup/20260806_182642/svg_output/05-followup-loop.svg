<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrowGreen" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2F6B4F"/>
    </marker>
    <marker id="arrowGold" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#D6A84B"/>
    </marker>
  </defs>

  <g id="background">
    <rect width="1280" height="720" fill="#F7F9F5"/>
  </g>

  <g id="header">
    <text x="68" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="bold" fill="#1F2A24">动态补问闭环</text>
    <text x="68" y="112" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#657269">每轮只补一个关键缺口，回答后重新评估是否需要继续</text>
    <rect x="68" y="132" width="1144" height="3" rx="1.5" fill="#DCE5DC"/>
  </g>

  <!-- Central loop: 5 nodes in a circle -->
  <!-- Node 1: 固定问答完成 (top) -->
  <g id="node-start">
    <rect x="490" y="170" width="300" height="72" rx="20" fill="#FFFFFF" stroke="#DCE5DC" stroke-width="2"/>
    <use data-icon="tabler-outline/clipboard-check" x="510" y="190" width="32" height="32" fill="none" stroke="#2F6B4F" stroke-width="2"/>
    <text x="560" y="200" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="bold" fill="#1F2A24">固定问答完成</text>
    <text x="560" y="226" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#657269">不等于信息已经完整</text>
  </g>

  <!-- Node 2: 完整度 Skill 判断 (right) -->
  <g id="node-check">
    <rect x="720" y="304" width="300" height="72" rx="20" fill="#EAF2E8" stroke="#2F6B4F" stroke-width="2"/>
    <use data-icon="tabler-outline/list-check" x="740" y="324" width="32" height="32" fill="none" stroke="#2F6B4F" stroke-width="2"/>
    <text x="790" y="334" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="bold" fill="#1F2A24">完整度 Skill 判断</text>
    <text x="790" y="360" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#657269">识别当前最关键信息缺口</text>
  </g>

  <!-- Node 3: 动态补问 (bottom) -->
  <g id="node-ask">
    <rect x="490" y="438" width="300" height="72" rx="20" fill="#2F6B4F"/>
    <use data-icon="tabler-outline/message-question" x="510" y="458" width="32" height="32" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="560" y="468" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF">追问 Skill 生成问题</text>
    <text x="560" y="494" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#FFFFFF" fill-opacity="0.72">一次一问、通俗自然、不诱导</text>
  </g>

  <!-- Node 4: 用户回答 (left) -->
  <g id="node-answer">
    <rect x="310" y="304" width="260" height="72" rx="20" fill="#FFFFFF" stroke="#DCE5DC" stroke-width="2"/>
    <use data-icon="tabler-outline/arrow-right" x="330" y="324" width="32" height="32" fill="none" stroke="#4C8C7A" stroke-width="2"/>
    <text x="380" y="334" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="bold" fill="#1F2A24">用户回答</text>
    <text x="380" y="360" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#657269">回答写入信息档案</text>
  </g>

  <!-- Arrows connecting the loop -->
  <!-- start -> check -->
  <line x1="700" y1="242" x2="804" y2="304" stroke="#2F6B4F" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <!-- check -> ask -->
  <line x1="800" y1="376" x2="700" y2="438" stroke="#2F6B4F" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <!-- ask -> answer -->
  <line x1="540" y1="438" x2="470" y2="376" stroke="#2F6B4F" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <!-- answer -> check (re-evaluate loop) -->
  <path d="M440 304 L440 260 L870 260 L870 304" fill="none" stroke="#D6A84B" stroke-width="3" stroke-dasharray="10,5" marker-end="url(#arrowGold)"/>

  <!-- Re-evaluate label -->
  <g id="reevaluate-label">
    <rect x="565" y="232" width="180" height="36" rx="12" fill="#FFFFFF" stroke="#DCE5DC"/>
    <text x="655" y="256" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold" fill="#D6A84B">回答后重新评估</text>
  </g>

  <!-- 5-round limit badge -->
  <g id="limit-badge">
    <rect x="68" y="170" width="220" height="72" rx="16" fill="#F6EFD9" stroke="#D6A84B" stroke-width="1.5"/>
    <use data-icon="tabler-outline/clock" x="88" y="190" width="28" height="28" fill="none" stroke="#D6A84B" stroke-width="2"/>
    <text x="130" y="200" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1F2A24">补问轮次上限</text>
    <text x="130" y="226" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#D6A84B">最多 5 轮动态补问</text>
  </g>

  <!-- Key principles card -->
  <g id="principles">
    <rect x="68" y="280" width="220" height="280" rx="16" fill="#FFFFFF" stroke="#DCE5DC" stroke-width="1.5"/>
    <text x="92" y="314" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="bold" fill="#2F6B4F">补问原则</text>
    <rect x="92" y="328" width="172" height="2" rx="1" fill="#DCE5DC"/>

    <circle cx="100" cy="356" r="4" fill="#4C8C7A"/>
    <text x="116" y="362" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#1F2A24">每轮只选一个最关</text>
    <text x="116" y="382" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#1F2A24">键的信息缺口</text>

    <circle cx="100" cy="412" r="4" fill="#4C8C7A"/>
    <text x="116" y="418" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#1F2A24">不重复已回答内容</text>

    <circle cx="100" cy="452" r="4" fill="#4C8C7A"/>
    <text x="116" y="458" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#1F2A24">不做诊断结论</text>

    <circle cx="100" cy="492" r="4" fill="#4C8C7A"/>
    <text x="116" y="498" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#1F2A24">回答后重新评估</text>

    <circle cx="100" cy="532" r="4" fill="#4C8C7A"/>
    <text x="116" y="538" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#1F2A24">满 5 轮或无缺口时</text>
    <text x="116" y="554" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#1F2A24">自动停止</text>
  </g>

  <!-- Output card (right side) -->
  <g id="output-card">
    <rect x="1040" y="170" width="180" height="380" rx="16" fill="#FFFFFF" stroke="#DCE5DC" stroke-width="1.5"/>
    <text x="1064" y="204" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="bold" fill="#2F6B4F">最终产出</text>
    <rect x="1064" y="218" width="132" height="2" rx="1" fill="#DCE5DC"/>

    <use data-icon="tabler-outline/file-description" x="1080" y="248" width="24" height="24" fill="none" stroke="#4C8C7A" stroke-width="2"/>
    <text x="1116" y="266" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1F2A24">信息档案</text>
    <text x="1088" y="292" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#657269">基础回答</text>
    <text x="1088" y="312" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#657269">+ 补问结果</text>

    <use data-icon="tabler-outline/clipboard-check" x="1080" y="350" width="24" height="24" fill="none" stroke="#2F6B4F" stroke-width="2"/>
    <text x="1116" y="368" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1F2A24">完整度报告</text>
    <text x="1088" y="394" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#657269">缺口分析</text>
    <text x="1088" y="414" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#657269">+ 检查建议</text>

    <use data-icon="tabler-outline/route" x="1080" y="452" width="24" height="24" fill="none" stroke="#D6A84B" stroke-width="2"/>
    <text x="1116" y="470" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1F2A24">诊中可用</text>
    <text x="1088" y="496" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#657269">结构化数据</text>
    <text x="1088" y="516" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" fill="#657269">可供后续引用</text>
  </g>

  <!-- Bottom summary -->
  <g id="summary">
    <rect x="318" y="568" width="644" height="58" rx="16" fill="#EAF2E8"/>
    <text x="640" y="604" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#2F6B4F">每补一问，重新评估 — 不浪费轮次、不纠缠次要信息</text>
  </g>

  <g id="footer">
    <text x="1212" y="682" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#657269">05</text>
  </g>
</svg>
