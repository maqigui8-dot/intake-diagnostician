<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <g id="background"><rect width="1280" height="720" fill="#F7F9F5" /></g>
  <g id="header">
    <text x="68" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="bold" fill="#1F2A24">组会反馈与目标调整</text>
    <text x="68" y="111" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#657269">从“答完题”转向“能否支撑后续诊中信息使用”</text>
    <path fill="#DCE5DC" d="M69.50,132 H1210.50 A1.50,1.50 0 0 1 1212,133.50 V133.50 A1.50,1.50 0 0 1 1210.50,135 H69.50 A1.50,1.50 0 0 1 68,133.50 V133.50 A1.50,1.50 0 0 1 69.50,132 Z" />
  </g>
  <g id="card-standard">
    <path fill="#FFFFFF" stroke="#DCE5DC" d="M84,168 H600 A16,16 0 0 1 616,184 V340 A16,16 0 0 1 600,356 H84 A16,16 0 0 1 68,340 V184 A16,16 0 0 1 84,168 Z" />
    <circle cx="112" cy="214" r="24" fill="#EAF2E8" />
    
  <g transform="translate(100, 202)" fill="none" stroke="#2F6B4F" stroke-width="2">
    <path d="M3.5 5.5l1.5 1.5l2.5 -2.5" />
    <path d="M3.5 11.5l1.5 1.5l2.5 -2.5" />
    <path d="M3.5 17.5l1.5 1.5l2.5 -2.5" />
    <path d="M11 6l9 0" />
    <path d="M11 12l9 0" />
    <path d="M11 18l9 0" />
  </g>
    <text x="150" y="220" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="bold" fill="#1F2A24">完整度判断标准</text>
    <text x="92" y="272" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#657269">不再仅判断固定题目是否完成</text>
    <text x="92" y="308" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#1F2A24">结合<tspan fill="#2F6B4F" font-weight="bold">十问歌框架</tspan>与临床问诊经验评估缺口</text>
  </g>
  <g id="card-goal">
    <path fill="#FFFFFF" stroke="#DCE5DC" d="M652,168 H1196 A16,16 0 0 1 1212,184 V340 A16,16 0 0 1 1196,356 H652 A16,16 0 0 1 636,340 V184 A16,16 0 0 1 652,168 Z" />
    <circle cx="680" cy="214" r="24" fill="#EAF2E8" />
    
  <g transform="translate(668, 202)" fill="none" stroke="#2F6B4F" stroke-width="2">
    <path d="M3 19a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" />
    <path d="M19 7a2 2 0 1 0 0 -4a2 2 0 0 0 0 4" />
    <path d="M11 19h5.5a3.5 3.5 0 0 0 0 -7h-8a3.5 3.5 0 0 1 0 -7h4.5" />
  </g>
    <text x="718" y="220" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="bold" fill="#1F2A24">面向后续诊中</text>
    <text x="660" y="272" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#657269">诊前问诊的结果不是终点</text>
    <text x="660" y="308" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#1F2A24">目标是形成<tspan fill="#2F6B4F" font-weight="bold">可继续使用的信息档案</tspan></text>
  </g>
  <g id="card-scope">
    <path fill="#FFFFFF" stroke="#DCE5DC" d="M84,380 H600 A16,16 0 0 1 616,396 V552 A16,16 0 0 1 600,568 H84 A16,16 0 0 1 68,552 V396 A16,16 0 0 1 84,380 Z" />
    <circle cx="112" cy="426" r="24" fill="#F6EFD9" />
    
  <g transform="translate(100, 414)" fill="none" stroke="#D6A84B" stroke-width="2">
    <path d="M11.46 20.846a12 12 0 0 1 -7.96 -14.846a12 12 0 0 0 8.5 -3a12 12 0 0 0 8.5 3a12 12 0 0 1 -.09 7.06" />
    <path d="M15 19l2 2l4 -4" />
  </g>
    <text x="150" y="432" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="bold" fill="#1F2A24">分析边界收敛</text>
    <text x="92" y="484" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#657269">删除辨证参考相关展示</text>
    <text x="92" y="520" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#1F2A24">只保留<tspan fill="#D6A84B" font-weight="bold">信息完整度</tspan>与<tspan fill="#D6A84B" font-weight="bold">推荐检查项目</tspan></text>
  </g>
  <g id="card-skills">
    <path fill="#2F6B4F" d="M652,380 H1196 A16,16 0 0 1 1212,396 V552 A16,16 0 0 1 1196,568 H652 A16,16 0 0 1 636,552 V396 A16,16 0 0 1 652,380 Z" />
    <circle cx="680" cy="426" r="24" fill="#FFFFFF" fill-opacity="0.16" />
    
  <g transform="translate(668, 414)" fill="none" stroke="#FFFFFF" stroke-width="2">
    <path d="M4 10a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" />
    <path d="M6 4v4" />
    <path d="M6 12v8" />
    <path d="M13.823 15.176a2 2 0 1 0 -2.638 2.651" />
    <path d="M12 4v10" />
    <path d="M16 7a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" />
    <path d="M18 4v1" />
    <path d="M18 9v5" />
    <path d="M15 19l2 2l4 -4" />
  </g>
    <text x="718" y="432" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="bold" fill="#FFFFFF">两个 Skill 明确分工</text>
    <text x="660" y="484" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#FFFFFF" fill-opacity="0.78">Skill 1：确认必问项与选问项</text>
    <text x="660" y="520" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#FFFFFF">Skill 2：决定追问表达与顺序</text>
  </g>
  <g id="bottom-summary">
    <path fill="#EAF2E8" d="M82,594 H1198 A14,14 0 0 1 1212,608 V638 A14,14 0 0 1 1198,652 H82 A14,14 0 0 1 68,638 V608 A14,14 0 0 1 82,594 Z" />
    <text x="92" y="631" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2F6B4F">本轮改造主线：标准重定义、流程闭环、能力拆分、边界收敛</text>
  </g>
  <g id="footer"><text x="1212" y="682" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#657269">02</text></g>
</svg>