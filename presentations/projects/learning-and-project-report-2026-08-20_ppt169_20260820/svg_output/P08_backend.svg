<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9F6"/><g id="header"><text x="64" y="82" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#155E47">后端学习</text><text x="64" y="144" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" font-weight="700" fill="#15221C">把业务规则封装为可验证的服务</text><text x="64" y="184" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" fill="#5E6D65">以 FastAPI 为主，练习路由、参数、响应、异常和本地服务启动。</text></g><g id="api-flow"><circle cx="228" cy="370" r="62" fill="#EAF2EB"/><text x="228" y="380" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="700" fill="#155E47">请求</text><line x1="290" y1="370" x2="488" y2="370" stroke="#4C8C7B" stroke-width="4"/><polygon points="488,370 470,359 470,381" fill="#4C8C7B"/><circle cx="584" cy="370" r="68" fill="#155E47"/><text x="584" y="362" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="700" fill="#F7F9F6">规则</text><text x="584" y="391" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="700" fill="#F7F9F6">服务</text><line x1="652" y1="370" x2="850" y2="370" stroke="#4C8C7B" stroke-width="4"/><polygon points="850,370 832,359 832,381" fill="#4C8C7B"/><circle cx="946" cy="370" r="62" fill="#EAF2EB"/><text x="946" y="380" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="700" fill="#155E47">响应</text></g><g id="points"><text x="64" y="536" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="700" fill="#15221C">接口承担的三件事：接收可信输入、执行确定性规则、返回结构化数据。</text><text x="64" y="577" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#5E6D65">这也是后续把 BMI、流程状态和档案结果交给前端的基础。</text><text x="1190" y="684" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#155E47">08</text></g></svg>
