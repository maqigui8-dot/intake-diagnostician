<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9F6"/><g id="header"><text x="64" y="82" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#155E47">框架深入：LangChain</text><text x="64" y="144" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" font-weight="700" fill="#15221C">脱离平台，理解 RAG 全链路模块</text></g><g id="modules"><rect x="64" y="252" width="250" height="98" rx="6" fill="#EAF2EB"/><text x="189" y="312" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="700" fill="#155E47">文档切分</text><rect x="350" y="252" width="250" height="98" rx="6" fill="#EAF2EB"/><text x="475" y="312" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="700" fill="#155E47">Embedding</text><rect x="636" y="252" width="250" height="98" rx="6" fill="#EAF2EB"/><text x="761" y="312" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="700" fill="#155E47">向量检索</text><rect x="922" y="252" width="294" height="98" rx="6" fill="#155E47"/><text x="1069" y="312" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="700" fill="#F7F9F6">Prompt 与模型回答</text></g><g id="meaning"><text x="64" y="461" font-family="Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="700" fill="#15221C">学习重点：每一环都可以独立替换、调试与评估，而不是把知识库当成黑盒。</text><text x="64" y="513" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#5E6D65">实践内容：基于 LangChain 与通义千问 API 的检索增强问答系统。</text><text x="1190" y="684" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#155E47">17</text></g></svg>
