<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9F6"/><g id="header"><text x="64" y="82" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#155E47">Agent 平台级入门</text><text x="64" y="144" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" font-weight="700" fill="#15221C">通过 Dify 与 Ollama 建立第一条 Agent 链路</text></g><g id="steps"><text x="84" y="280" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="700" fill="#155E47">部署</text><text x="84" y="320" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#5E6D65">部署 Dify 平台</text><text x="366" y="280" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="700" fill="#4C8C7B">模型</text><text x="366" y="320" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#5E6D65">Ollama 本地模型与 API</text><text x="688" y="280" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="700" fill="#E07A5F">知识</text><text x="688" y="320" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#5E6D65">挂载古籍知识库</text><text x="1000" y="280" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="700" fill="#155E47">对话</text><text x="1000" y="320" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#5E6D65">多轮问答与提示词</text><line x1="84" y1="370" x2="1160" y2="370" stroke="#C9D7CE" stroke-width="3"/></g><g id="result"><rect x="64" y="480" width="1152" height="102" rx="6" fill="#EAF2EB"/><text x="96" y="525" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="700" fill="#15221C">平台实践解决的问题：快速看见“模型、知识库、提示词、工具”如何共同组成一个可交互应用。</text><text x="96" y="557" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#5E6D65">随后再进入 LangChain、LangGraph 和 DeepAgents，理解它们背后的模块化实现。</text><text x="1190" y="684" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#155E47">13</text></g></svg>
