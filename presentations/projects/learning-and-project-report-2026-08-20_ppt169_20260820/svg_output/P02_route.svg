<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9F6"/><g id="header"><text x="64" y="82" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#155E47">学习路线</text><text x="64" y="144" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" font-weight="700" fill="#15221C">从基础开发到医疗 AI 应用</text><text x="64" y="184" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" fill="#5E6D65">基本要求提供方向，学习内容通过可运行练习逐步沉淀。</text></g><g id="frontend"><text x="78" y="300" font-family="Microsoft YaHei, Arial, sans-serif" font-size="56" font-weight="700" fill="#155E47">01</text><text x="78" y="365" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="700" fill="#15221C">前端学习</text><text x="78" y="405" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#5E6D65">HTML · CSS · JavaScript</text><text x="78" y="435" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#5E6D65">Vue · Vite · TypeScript</text></g><g id="backend"><text x="490" y="300" font-family="Microsoft YaHei, Arial, sans-serif" font-size="56" font-weight="700" fill="#4C8C7B">02</text><text x="490" y="365" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="700" fill="#15221C">后端学习</text><text x="490" y="405" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#5E6D65">FastAPI · REST API · JSON</text><text x="490" y="435" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#5E6D65">规则计算 · 参数校验</text></g><g id="agent"><text x="902" y="300" font-family="Microsoft YaHei, Arial, sans-serif" font-size="56" font-weight="700" fill="#E07A5F">03</text><text x="902" y="365" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="700" fill="#15221C">Agent 学习</text><text x="902" y="405" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#5E6D65">Dify · RAG · MCP</text><text x="902" y="435" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#5E6D65">LangChain · LangGraph · DeepAgents</text></g><g id="takeaway"><rect x="64" y="552" width="1152" height="72" rx="6" fill="#EAF2EB"/><text x="96" y="597" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="700" fill="#155E47">三条学习线最终交汇为：可交互的界面、可验证的服务、可控的智能化流程。</text><text x="1190" y="684" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#155E47">02</text></g></svg>
