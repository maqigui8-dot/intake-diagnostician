<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9F6"/><g id="header"><text x="64" y="82" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#155E47">对话原型实践</text><text x="64" y="144" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" font-weight="700" fill="#15221C">“克隆老中医”：用多轮对话练习采集流程</text><text x="64" y="184" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" fill="#5E6D65">基于 Dify、知识库和模型服务构建的学习原型。</text></g><g id="dialogue"><rect x="64" y="258" width="700" height="72" rx="6" fill="#EAF2EB"/><text x="96" y="304" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#15221C">患者：描述不适与生活状态</text><rect x="236" y="354" width="700" height="72" rx="6" fill="#EAF2EB"/><text x="268" y="400" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#15221C">助手：围绕饮食、睡眠、情绪等维度继续追问</text><rect x="64" y="450" width="700" height="72" rx="6" fill="#EAF2EB"/><text x="96" y="496" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#15221C">系统：汇总为结构化记录，附带知识库检索内容</text></g><g id="lessons"><text x="854" y="296" font-family="Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="700" fill="#155E47">练习到的能力</text><text x="854" y="349" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" fill="#15221C">多轮流程控制</text><text x="854" y="391" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" fill="#15221C">结构化总结</text><text x="854" y="433" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" fill="#15221C">知识库回答</text><text x="854" y="475" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" fill="#15221C">用户表达理解</text></g><g id="footer"><text x="64" y="612" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#C94A3D">当前项目对这一原型进行了安全收敛：不在线确诊和开方，重点转为诊前资料整理。</text><text x="1190" y="684" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#155E47">15</text></g></svg>
