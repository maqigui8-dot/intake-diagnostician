<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9F6"/><g id="header"><text x="64" y="82" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#155E47">框架深入：DeepAgents</text><text x="64" y="144" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" font-weight="700" fill="#15221C">将工具、记忆和流程编排为智能体原型</text></g><g id="layers"><rect x="64" y="240" width="1152" height="58" rx="6" fill="#155E47"/><text x="96" y="278" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#F7F9F6">对话流程：身份确认 → 历史查询 → 信息处理 → 结构化报告</text><rect x="64" y="322" width="1152" height="58" rx="6" fill="#EAF2EB"/><text x="96" y="360" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#15221C">工具层：查询历史、保存会话、检索知识库</text><rect x="64" y="404" width="1152" height="58" rx="6" fill="#EAF2EB"/><text x="96" y="442" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#15221C">数据层：PostgreSQL 优先，SQLite 回退，支持持久化记录</text></g><g id="meaning"><text x="64" y="546" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#E07A5F">学习价值：理解 Agent 不是单轮聊天，而是可组合、可保存、可审查的程序流程。</text><text x="1190" y="684" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#155E47">19</text></g></svg>
