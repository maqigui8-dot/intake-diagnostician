<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9F6"/><g id="header"><text x="64" y="82" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#155E47">框架深入：LangGraph</text><text x="64" y="144" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" font-weight="700" fill="#15221C">用状态图和持久化记忆承接多轮对话</text></g><g id="state"><circle cx="208" cy="362" r="62" fill="#EAF2EB"/><text x="208" y="372" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="700" fill="#155E47">身份确认</text><circle cx="500" cy="362" r="62" fill="#4C8C7B"/><text x="500" y="372" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="700" fill="#F7F9F6">查询历史</text><circle cx="792" cy="362" r="62" fill="#E07A5F"/><text x="792" y="372" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="700" fill="#F7F9F6">本次对话</text><circle cx="1084" cy="362" r="62" fill="#155E47"/><text x="1084" y="372" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="700" fill="#F7F9F6">保存记录</text><line x1="270" y1="362" x2="438" y2="362" stroke="#C9D7CE" stroke-width="4"/><line x1="562" y1="362" x2="730" y2="362" stroke="#C9D7CE" stroke-width="4"/><line x1="854" y1="362" x2="1022" y2="362" stroke="#C9D7CE" stroke-width="4"/></g><g id="insight"><rect x="64" y="526" width="1152" height="76" rx="6" fill="#EAF2EB"/><text x="96" y="572" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#15221C">实践：带永久记忆的中医复诊 Agent；核心收获是“流程状态”和“长期记录”应被分开管理。</text><text x="1190" y="684" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#155E47">18</text></g></svg>
