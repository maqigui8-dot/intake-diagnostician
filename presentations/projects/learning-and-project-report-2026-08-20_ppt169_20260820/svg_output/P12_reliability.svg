<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9F6"/><g id="header"><text x="64" y="82" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#155E47">可靠性学习</text><text x="64" y="144" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" font-weight="700" fill="#15221C">结构化输出不是只写一个提示词</text></g><g id="items"><text x="78" y="290" font-family="Microsoft YaHei, Arial, sans-serif" font-size="54" font-weight="700" fill="#155E47">01</text><text x="160" y="290" font-family="Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="700" fill="#15221C">环境变量管理密钥</text><text x="160" y="322" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#5E6D65">避免把 API Key 写入代码</text><text x="78" y="400" font-family="Microsoft YaHei, Arial, sans-serif" font-size="54" font-weight="700" fill="#4C8C7B">02</text><text x="160" y="400" font-family="Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="700" fill="#15221C">多层 JSON 解析与错误兜底</text><text x="160" y="432" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#5E6D65">处理模型返回代码块、额外文本或字段缺失</text><text x="718" y="290" font-family="Microsoft YaHei, Arial, sans-serif" font-size="54" font-weight="700" fill="#E07A5F">03</text><text x="800" y="290" font-family="Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="700" fill="#15221C">Pydantic 定义接口边界</text><text x="800" y="322" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#5E6D65">校验输入输出，自动形成接口文档</text><text x="718" y="400" font-family="Microsoft YaHei, Arial, sans-serif" font-size="54" font-weight="700" fill="#155E47">04</text><text x="800" y="400" font-family="Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="700" fill="#15221C">服务失败时保持流程可继续</text><text x="800" y="432" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#5E6D65">为后续系统降级策略提供经验</text></g><g id="footer"><rect x="64" y="550" width="1152" height="64" rx="6" fill="#EAF2EB"/><text x="96" y="591" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#155E47">从“调用模型”到“让服务在不确定输出下仍可控”，是学习阶段的重要提升。</text><text x="1190" y="684" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#155E47">12</text></g></svg>
