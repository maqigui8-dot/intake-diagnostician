<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9F6" /><g id="header"><text x="64" y="82" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#155E47">前端学习</text><text x="64" y="144" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" font-weight="700" fill="#15221C">先理解页面如何响应用户</text><text x="64" y="184" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" fill="#5E6D65">以 HTML、CSS、JavaScript 为基础，使用 Vue 组织可维护的交互页面。</text></g><g id="stack"><text x="92" y="315" font-family="Microsoft YaHei, Arial, sans-serif" font-size="32" font-weight="700" fill="#155E47">HTML</text><line x1="92" y1="335" x2="432" y2="335" stroke="#C9D7CE" /><text x="92" y="375" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#5E6D65">页面结构与语义</text><text x="470" y="315" font-family="Microsoft YaHei, Arial, sans-serif" font-size="32" font-weight="700" fill="#4C8C7B">CSS</text><line x1="470" y1="335" x2="810" y2="335" stroke="#C9D7CE" /><text x="470" y="375" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#5E6D65">布局、视觉层级与响应式</text><text x="848" y="315" font-family="Microsoft YaHei, Arial, sans-serif" font-size="32" font-weight="700" fill="#E07A5F">JavaScript</text><line x1="848" y1="335" x2="1188" y2="335" stroke="#C9D7CE" /><text x="848" y="375" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#5E6D65">事件、状态与数据交互</text></g><g id="vue"><path fill="#EAF2EB" d="M70,478 H1210 A6,6 0 0 1 1216,484 V577 A6,6 0 0 1 1210,583 H70 A6,6 0 0 1 64,577 V484 A6,6 0 0 1 70,478 Z" /><text x="96" y="525" font-family="Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="700" fill="#15221C">Vue 3 的作用：将界面状态、用户操作和页面更新组织成清晰的组件逻辑。</text><text x="96" y="557" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#5E6D65">同步学习 Vite、TypeScript、Git 和 npm/pnpm 等工程化工具。</text><text x="1190" y="684" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#155E47">05</text></g></svg>