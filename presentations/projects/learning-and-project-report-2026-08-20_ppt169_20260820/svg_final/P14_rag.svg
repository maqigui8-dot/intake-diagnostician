<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9F6" /><g id="header"><text x="64" y="82" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#155E47">RAG 知识库流程</text><text x="64" y="144" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" font-weight="700" fill="#15221C">让模型回答时参考可检索的资料</text></g><g id="flow"><path fill="#EAF2EB" d="M70,266 H264 A6,6 0 0 1 270,272 V348 A6,6 0 0 1 264,354 H70 A6,6 0 0 1 64,348 V272 A6,6 0 0 1 70,266 Z" /><text x="167" y="320" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="700" fill="#155E47">上传资料</text><path fill="#EAF2EB" d="M320,266 H514 A6,6 0 0 1 520,272 V348 A6,6 0 0 1 514,354 H320 A6,6 0 0 1 314,348 V272 A6,6 0 0 1 320,266 Z" /><text x="417" y="320" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="700" fill="#155E47">切分与向量化</text><path fill="#EAF2EB" d="M570,266 H764 A6,6 0 0 1 770,272 V348 A6,6 0 0 1 764,354 H570 A6,6 0 0 1 564,348 V272 A6,6 0 0 1 570,266 Z" /><text x="667" y="320" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="700" fill="#155E47">检索相关片段</text><path fill="#EAF2EB" d="M820,266 H1014 A6,6 0 0 1 1020,272 V348 A6,6 0 0 1 1014,354 H820 A6,6 0 0 1 814,348 V272 A6,6 0 0 1 820,266 Z" /><text x="917" y="320" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="700" fill="#155E47">拼接提示词</text><path fill="#155E47" d="M1070,266 H1210 A6,6 0 0 1 1216,272 V348 A6,6 0 0 1 1210,354 H1070 A6,6 0 0 1 1064,348 V272 A6,6 0 0 1 1070,266 Z" /><text x="1140" y="320" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="700" fill="#F7F9F6">回答</text></g><g id="meaning"><text x="64" y="474" font-family="Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="700" fill="#15221C">实践内容：创建知识库并上传中医古籍，观察检索内容如何进入模型回答。</text><text x="64" y="520" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#5E6D65">学习重点不是“让模型背资料”，而是理解知识来源、检索范围和回答引用之间的关系。</text><text x="1190" y="684" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#155E47">14</text></g></svg>