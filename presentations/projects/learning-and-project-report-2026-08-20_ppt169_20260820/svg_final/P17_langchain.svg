<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9F6" /><g id="header"><text x="64" y="82" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#155E47">框架深入：LangChain</text><text x="64" y="144" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" font-weight="700" fill="#15221C">脱离平台，理解 RAG 全链路模块</text></g><g id="modules"><path fill="#EAF2EB" d="M70,252 H308 A6,6 0 0 1 314,258 V344 A6,6 0 0 1 308,350 H70 A6,6 0 0 1 64,344 V258 A6,6 0 0 1 70,252 Z" /><text x="189" y="312" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="700" fill="#155E47">文档切分</text><path fill="#EAF2EB" d="M356,252 H594 A6,6 0 0 1 600,258 V344 A6,6 0 0 1 594,350 H356 A6,6 0 0 1 350,344 V258 A6,6 0 0 1 356,252 Z" /><text x="475" y="312" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="700" fill="#155E47">Embedding</text><path fill="#EAF2EB" d="M642,252 H880 A6,6 0 0 1 886,258 V344 A6,6 0 0 1 880,350 H642 A6,6 0 0 1 636,344 V258 A6,6 0 0 1 642,252 Z" /><text x="761" y="312" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="700" fill="#155E47">向量检索</text><path fill="#155E47" d="M928,252 H1210 A6,6 0 0 1 1216,258 V344 A6,6 0 0 1 1210,350 H928 A6,6 0 0 1 922,344 V258 A6,6 0 0 1 928,252 Z" /><text x="1069" y="312" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="700" fill="#F7F9F6">Prompt 与模型回答</text></g><g id="meaning"><text x="64" y="461" font-family="Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="700" fill="#15221C">学习重点：每一环都可以独立替换、调试与评估，而不是把知识库当成黑盒。</text><text x="64" y="513" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#5E6D65">实践内容：基于 LangChain 与通义千问 API 的检索增强问答系统。</text><text x="1190" y="684" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#155E47">17</text></g></svg>