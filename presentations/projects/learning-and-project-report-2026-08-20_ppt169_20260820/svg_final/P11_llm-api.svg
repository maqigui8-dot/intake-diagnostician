<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9F6" /><g id="header"><text x="64" y="82" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#155E47">大模型 API 原型</text><text x="64" y="144" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" font-weight="700" fill="#15221C">完成症状信息到结构化结果的接口探索</text><text x="64" y="184" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" fill="#5E6D65">使用 FastAPI 接收症状与舌象，将提示词发送给兼容 OpenAI 协议的模型服务。</text></g><g id="pipeline"><path fill="#EAF2EB" d="M70,285 H328 A6,6 0 0 1 334,291 V409 A6,6 0 0 1 328,415 H70 A6,6 0 0 1 64,409 V291 A6,6 0 0 1 70,285 Z" /><text x="96" y="340" font-family="Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="700" fill="#155E47">输入</text><text x="96" y="378" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#15221C">症状、舌象等资料</text><path fill="#155E47" d="M511,285 H769 A6,6 0 0 1 775,291 V409 A6,6 0 0 1 769,415 H511 A6,6 0 0 1 505,409 V291 A6,6 0 0 1 511,285 Z" /><text x="537" y="340" font-family="Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="700" fill="#F7F9F6">模型调用</text><text x="537" y="378" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#F7F9F6">提示词与响应解析</text><path fill="#EAF2EB" d="M952,285 H1210 A6,6 0 0 1 1216,291 V409 A6,6 0 0 1 1210,415 H952 A6,6 0 0 1 946,409 V291 A6,6 0 0 1 952,285 Z" /><text x="978" y="340" font-family="Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="700" fill="#155E47">输出</text><text x="978" y="378" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#15221C">结构化字段与提示</text><line x1="334" y1="350" x2="505" y2="350" stroke="#4C8C7B" stroke-width="4" /><line x1="775" y1="350" x2="946" y2="350" stroke="#4C8C7B" stroke-width="4" /></g><g id="boundary"><text x="64" y="570" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="700" fill="#C94A3D">定位：这是能力探索原型；当前项目已将对模型的使用收敛到理解、追问与资料整理。</text><text x="1190" y="684" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#155E47">11</text></g></svg>