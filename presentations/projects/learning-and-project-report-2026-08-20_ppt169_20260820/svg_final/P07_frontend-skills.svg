<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9F6" /><g id="header"><text x="64" y="82" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#155E47">前端能力沉淀</text><text x="64" y="144" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" font-weight="700" fill="#15221C">从练习页面带走的三类能力</text></g><g id="state"><text x="84" y="282" font-family="Microsoft YaHei, Arial, sans-serif" font-size="54" font-weight="700" fill="#155E47">状态</text><text x="84" y="330" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#15221C">把用户填写、进度和结果</text><text x="84" y="361" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#15221C">变为可管理的数据状态</text></g><g id="render"><text x="462" y="282" font-family="Microsoft YaHei, Arial, sans-serif" font-size="54" font-weight="700" fill="#4C8C7B">渲染</text><text x="462" y="330" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#15221C">根据状态实时更新页面，</text><text x="462" y="361" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#15221C">减少手动操作 DOM</text></g><g id="experience"><text x="840" y="282" font-family="Microsoft YaHei, Arial, sans-serif" font-size="54" font-weight="700" fill="#E07A5F">体验</text><text x="840" y="330" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#15221C">关注输入、提示、空状态</text><text x="840" y="361" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#15221C">与异常场景的连续性</text></g><g id="transfer"><path fill="#EAF2EB" d="M70,520 H1210 A6,6 0 0 1 1216,526 V594 A6,6 0 0 1 1210,600 H70 A6,6 0 0 1 64,594 V526 A6,6 0 0 1 70,520 Z" /><text x="96" y="569" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#155E47">迁移到项目：支撑了诊前资料表单、对话历史、流程进度和结果展示。</text><text x="1190" y="684" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#155E47">07</text></g></svg>