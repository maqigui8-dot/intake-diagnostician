<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9F6" /><g id="header"><text x="64" y="82" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#E07A5F">学习成果总览</text><text x="64" y="144" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" font-weight="700" fill="#15221C">已完成的学习不止停留在知识点</text><text x="64" y="184" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" fill="#5E6D65">每条学习线都通过一个或多个可运行原型来检验理解。</text></g><g id="pillar-one"><path fill="#EAF2EB" d="M70,250 H408 A6,6 0 0 1 414,256 V522 A6,6 0 0 1 408,528 H70 A6,6 0 0 1 64,522 V256 A6,6 0 0 1 70,250 Z" /><text x="96" y="316" font-family="Microsoft YaHei, Arial, sans-serif" font-size="29" font-weight="700" fill="#155E47">页面交互</text><text x="96" y="365" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#15221C">Vue Todo List</text><text x="96" y="402" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#5E6D65">列表、编辑、筛选、状态切换</text><text x="96" y="432" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#5E6D65">本地持久化与响应式渲染</text></g><g id="pillar-two"><path fill="#EAF2EB" d="M471,250 H809 A6,6 0 0 1 815,256 V522 A6,6 0 0 1 809,528 H471 A6,6 0 0 1 465,522 V256 A6,6 0 0 1 471,250 Z" /><text x="497" y="316" font-family="Microsoft YaHei, Arial, sans-serif" font-size="29" font-weight="700" fill="#155E47">服务接口</text><text x="497" y="365" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#15221C">FastAPI BMI 与 LLM API</text><text x="497" y="402" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#5E6D65">参数、规则、JSON 与异常处理</text><text x="497" y="432" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#5E6D65">前端请求到后端响应的闭环</text></g><g id="pillar-three"><path fill="#EAF2EB" d="M872,250 H1210 A6,6 0 0 1 1216,256 V522 A6,6 0 0 1 1210,528 H872 A6,6 0 0 1 866,522 V256 A6,6 0 0 1 872,250 Z" /><text x="898" y="316" font-family="Microsoft YaHei, Arial, sans-serif" font-size="29" font-weight="700" fill="#155E47">智能体流程</text><text x="898" y="365" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#15221C">RAG 与持久记忆 Agent</text><text x="898" y="402" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#5E6D65">知识库、工具调用与状态管理</text><text x="898" y="432" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#5E6D65">多轮对话的流程编排</text></g><g id="footer"><text x="64" y="620" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="700" fill="#15221C">学习方式：以小原型验证抽象概念，再将能力迁移到实际项目。</text><text x="1190" y="684" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#155E47">03</text></g></svg>