<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9F6" /><g id="header"><text x="64" y="82" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#155E47">规则计算的启发</text><text x="64" y="144" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" font-weight="700" fill="#15221C">关键数值由确定性规则计算</text><text x="64" y="184" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" fill="#5E6D65">BMI 原型带来的重要认识：涉及阈值和安全边界的内容，不能交给模型猜测。</text></g><g id="contrast"><text x="132" y="330" font-family="Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="700" fill="#155E47">规则擅长</text><text x="132" y="383" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#15221C">计算</text><text x="132" y="420" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#15221C">校验</text><text x="132" y="457" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#15221C">分级</text><line x1="474" y1="280" x2="474" y2="492" stroke="#C9D7CE" stroke-width="2" /><text x="564" y="330" font-family="Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="700" fill="#E07A5F">模型擅长</text><text x="564" y="383" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#15221C">理解自然语言</text><text x="564" y="420" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#15221C">解释术语</text><text x="564" y="457" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#15221C">组织追问</text></g><g id="takeaway"><path fill="#EAF2EB" d="M70,558 H1210 A6,6 0 0 1 1216,564 V618 A6,6 0 0 1 1210,624 H70 A6,6 0 0 1 64,618 V564 A6,6 0 0 1 70,558 Z" /><text x="96" y="599" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#155E47">这条分工直接成为当前项目“规则负责判断，AI 负责理解”的设计原则。</text><text x="1190" y="684" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#155E47">10</text></g></svg>