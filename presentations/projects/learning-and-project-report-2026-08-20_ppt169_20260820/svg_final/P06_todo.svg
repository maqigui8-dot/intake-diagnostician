<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#F7F9F6" /><g id="header"><text x="64" y="82" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#155E47">Vue 练习原型</text><text x="64" y="144" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" font-weight="700" fill="#15221C">Todo List：用完整交互理解响应式开发</text></g><g id="functions"><path fill="#155E47" d="M70,220 H1210 A6,6 0 0 1 1216,226 V276 A6,6 0 0 1 1210,282 H70 A6,6 0 0 1 64,276 V226 A6,6 0 0 1 70,220 Z" /><text x="96" y="260" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="700" fill="#F7F9F6">任务添加 → 编辑 → 完成 → 筛选 → 清除 → 本地持久化</text><text x="78" y="355" font-family="Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="700" fill="#15221C">输入与事件</text><text x="78" y="389" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#5E6D65">v-model、键盘事件、点击与失焦处理</text><text x="442" y="355" font-family="Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="700" fill="#15221C">状态与渲染</text><text x="442" y="389" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#5E6D65">ref、computed、v-for、v-if</text><text x="806" y="355" font-family="Microsoft YaHei, Arial, sans-serif" font-size="25" font-weight="700" fill="#15221C">体验与持久化</text><text x="806" y="389" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#5E6D65">编辑聚焦、空状态、localStorage</text></g><g id="learning"><path fill="#EAF2EB" d="M70,495 H1210 A6,6 0 0 1 1216,501 V583 A6,6 0 0 1 1210,589 H70 A6,6 0 0 1 64,583 V501 A6,6 0 0 1 70,495 Z" /><text x="96" y="535" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="700" fill="#E07A5F">学习收获</text><text x="96" y="571" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" fill="#15221C">把一个“用户操作”拆成状态变化、界面更新与数据保存，为后续业务页面打下基础。</text><text x="1190" y="684" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#155E47">06</text></g></svg>